---
- name: Exercise application upload and download through S3
  when: not ansible_check_mode
  block:
    - name: Upload smoke-test object through the application
      ansible.builtin.uri:
        url: "{{ storage_smoke_app_url }}/api/files/upload"
        method: POST
        body_format: form-multipart
        body:
          file:
            content: "{{ storage_smoke_content }}"
            filename: "{{ storage_smoke_filename }}"
            mime_type: text/plain
        status_code: 201
        return_content: true
      register: storage_smoke_upload

    - name: Validate upload response
      ansible.builtin.assert:
        that:
          - storage_smoke_upload.json.key is string
          - storage_smoke_upload.json.key | length > 0
          - storage_smoke_upload.json.key is match('^' ~ object_storage_object_prefix ~ '/.+')
          - storage_smoke_upload.json.url is string
          - storage_smoke_upload.json.url | length > 0
        fail_msg: "The application did not return a valid S3 object key and URL."

    - name: Request a fresh presigned download URL
      ansible.builtin.uri:
        url: "{{ storage_smoke_app_url }}/api/files/view?key={{ storage_smoke_upload.json.key | urlencode }}"
        method: GET
        status_code: 200
        return_content: true
      register: storage_smoke_view

    - name: Validate refreshed download URL
      ansible.builtin.assert:
        that:
          - storage_smoke_view.json.key == storage_smoke_upload.json.key
          - storage_smoke_view.json.url is string
          - storage_smoke_view.json.url | length > 0
        fail_msg: "The application did not return a fresh S3 download URL."

    - name: Download smoke-test object through the presigned URL
      ansible.builtin.uri:
        url: "{{ storage_smoke_view.json.url }}"
        method: GET
        status_code: 200
        return_content: true
      delegate_to: localhost
      become: false
      register: storage_smoke_download

    - name: Verify downloaded object content
      ansible.builtin.assert:
        that:
          - storage_smoke_download.content == storage_smoke_content
        fail_msg: "The object downloaded through the presigned URL has unexpected content."

    - name: Verify application credentials cannot delete objects
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --env
          - MC_HOST_app
          - "{{ storage_smoke_s3_client_image }}"
          - rm
          - --force
          - "app/{{ object_storage_bucket }}/{{ storage_smoke_upload.json.key }}"
      environment:
        MC_HOST_app: >-
          http://{{ object_storage_access_key }}:{{ object_storage_secret_key }}@127.0.0.1:{{ storage_smoke_s3_api_port }}
      delegate_to: "{{ storage_smoke_object_storage_host }}"
      remote_user: "{{ storage_smoke_object_storage_user }}"
      become: true
      register: storage_smoke_forbidden_delete
      changed_when: false
      failed_when: storage_smoke_forbidden_delete.rc == 0
      no_log: true

  always:
    - name: Remove smoke-test object with object storage administrative credentials
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --env
          - MC_HOST_local
          - "{{ storage_smoke_s3_client_image }}"
          - rm
          - --force
          - "local/{{ object_storage_bucket }}/{{ storage_smoke_upload.json.key }}"
      environment:
        MC_HOST_local: >-
          http://{{ object_storage_admin_access_key }}:{{ object_storage_admin_secret_key }}@127.0.0.1:{{ storage_smoke_s3_api_port }}
      delegate_to: "{{ storage_smoke_object_storage_host }}"
      remote_user: "{{ storage_smoke_object_storage_user }}"
      become: true
      changed_when: true
      no_log: true
      when:
        - storage_smoke_upload is defined
        - storage_smoke_upload.json is defined
        - storage_smoke_upload.json.key is defined
