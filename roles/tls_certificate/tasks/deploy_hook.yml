---
- name: Create Certbot deploy-hook directory
  ansible.builtin.file:
    path: "{{ tls_certificate_deploy_hook | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Nginx reload hook for renewed certificates
  ansible.builtin.copy:
    dest: "{{ tls_certificate_deploy_hook }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      if ! nginx_test_output=$(/usr/sbin/nginx -t 2>&1); then
          printf '%s\n' "$nginx_test_output" >&2
          exit 1
      fi
      /bin/systemctl reload nginx
