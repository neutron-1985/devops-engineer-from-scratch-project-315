---
- name: Validate MinIO configuration
  ansible.builtin.assert:
    that:
      - minio_root_user | default('') | length >= 3
      - minio_root_password | default('') | length >= 16
      - minio_app_access_key | default('') | length >= 3
      - minio_app_secret_key | default('') | length >= 16
      - (minio_app_access_key | default('')) != (minio_root_user | default(''))
      - (minio_app_secret_key | default('')) != (minio_root_password | default(''))
      - minio_app_object_prefix | default('') | length > 0
      - minio_app_policy_name | default('') | length > 0
      - minio_container_uid | string is match('^[1-9][0-9]*$')
      - minio_container_gid | string is match('^[1-9][0-9]*$')
    fail_msg: >-
      MinIO requires distinct root/application credentials and an application
      policy, and must run with a non-root UID/GID.
  no_log: true

