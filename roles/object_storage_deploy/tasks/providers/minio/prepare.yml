---
- name: Create MinIO directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ minio_data_dir }}"
      mode: "0750"
    - path: "{{ minio_config_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Render least-privilege MinIO application policy
  ansible.builtin.template:
    src: application-policy.json.j2
    dest: "{{ minio_app_policy_file }}"
    owner: root
    group: root
    mode: "0600"

