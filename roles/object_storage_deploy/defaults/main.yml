---
object_storage_provider: rustfs
object_storage_deploy_api_port: "{{ object_storage_api_port }}"
object_storage_deploy_pull_image: true
object_storage_deploy_console_enabled: true
object_storage_healthcheck_retries: 20
object_storage_healthcheck_delay: 2

minio_image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
minio_client_image: minio/mc:RELEASE.2025-08-13T08-35-41Z
minio_container_name: project-devops-minio
minio_bucket: "{{ object_storage_bucket }}"
minio_region: "{{ object_storage_region }}"
minio_root_user: "{{ object_storage_admin_access_key }}"
minio_root_password: "{{ object_storage_admin_secret_key }}"
minio_app_object_prefix: "{{ object_storage_object_prefix }}"
minio_app_policy_name: "{{ object_storage_policy_name }}"
minio_app_access_key: "{{ object_storage_access_key }}"
minio_app_secret_key: "{{ object_storage_secret_key }}"
minio_public_downloads: true

rustfs_image: rustfs/rustfs:1.0.0-beta.3
rustfs_client_image: rustfs/rc:v0.1.27
rustfs_container_name: project-devops-rustfs
rustfs_container_uid: "10001"
rustfs_bucket: "{{ object_storage_bucket }}"
rustfs_region: "{{ object_storage_region }}"
rustfs_access_key: "{{ object_storage_admin_access_key }}"
rustfs_secret_key: "{{ object_storage_admin_secret_key }}"
rustfs_app_object_prefix: "{{ object_storage_object_prefix }}"
rustfs_app_policy_name: "{{ object_storage_policy_name }}"
rustfs_app_access_key: "{{ object_storage_access_key }}"
rustfs_app_secret_key: "{{ object_storage_secret_key }}"
rustfs_public_downloads: true

