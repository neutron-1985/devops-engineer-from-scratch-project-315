---
- name: Check certificate after issuance
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ nginx_https_certificate_name }}/fullchain.pem"
  register: nginx_https_issued_certificate

- name: Require certificate after live issuance
  ansible.builtin.assert:
    that:
      - nginx_https_issued_certificate.stat.exists
    fail_msg: "Certbot completed without creating the expected certificate."
  when: not ansible_check_mode

- name: Install HTTPS virtual host
  ansible.builtin.template:
    src: project-devops-deploy.conf.j2
    dest: "{{ nginx_https_site_path }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    nginx_https_certificate_exists: >-
      {{ nginx_https_issued_certificate.stat.exists | default(false) }}
  notify: Reload Nginx after HTTPS configuration

- name: Validate HTTPS configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  when:
    - not ansible_check_mode or nginx_https_issued_certificate.stat.exists

- name: Apply HTTPS configuration
  ansible.builtin.meta: flush_handlers
