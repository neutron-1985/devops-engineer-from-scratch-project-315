---
- name: Create ACME challenge webroot
  ansible.builtin.file:
    path: "{{ certbot_webroot }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Check whether the TLS certificate exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ nginx_https_certificate_name }}/fullchain.pem"
  register: nginx_https_certificate

- name: Install HTTP ACME bootstrap virtual host
  ansible.builtin.template:
    src: project-devops-deploy.conf.j2
    dest: "{{ nginx_https_site_path }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    nginx_https_certificate_exists: >-
      {{ nginx_https_certificate.stat.exists | default(false) }}
  notify: Reload Nginx after HTTPS configuration

- name: Enable HTTPS-managed virtual host
  ansible.builtin.file:
    src: "{{ nginx_https_site_path }}"
    dest: /etc/nginx/sites-enabled/project-devops-deploy.conf
    state: link
  notify: Reload Nginx after HTTPS configuration

- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx after HTTPS configuration

- name: Validate HTTP ACME bootstrap configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Apply HTTP ACME bootstrap configuration
  ansible.builtin.meta: flush_handlers
