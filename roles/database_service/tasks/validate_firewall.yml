---
- name: Validate PostgreSQL firewall allowlist
  ansible.builtin.assert:
    that:
      - (postgresql_allowed_cidrs | type_debug) == 'list'
      - postgresql_allowed_cidrs | length > 0
    fail_msg: PostgreSQL firewall requires a non-empty list of IPv4 CIDRs.

- name: Validate PostgreSQL firewall CIDRs
  ansible.builtin.assert:
    that:
      - (item | type_debug) == 'str'
      - >-
        item is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$')
      - >-
        item.split('/') | first | split('.') | map('int')
        | select('gt', 255) | list | length == 0
    fail_msg: "Invalid PostgreSQL IPv4 CIDR: {{ item }}"
  loop: "{{ postgresql_allowed_cidrs }}"
