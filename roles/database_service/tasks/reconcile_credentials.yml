---
- name: Reconcile PostgreSQL credentials
  when: not ansible_check_mode
  block:
    - name: Check whether desired PostgreSQL credentials are active
      community.docker.docker_container_exec:
        container: "{{ postgresql_container_name }}"
        user: postgres
        env:
          PGPASSWORD: "{{ postgresql_password }}"
        argv:
          - psql
          - --host
          - 127.0.0.1
          - --username
          - "{{ postgresql_user }}"
          - --dbname
          - "{{ postgresql_database }}"
          - --no-password
          - --command
          - SELECT 1;
      register: postgresql_desired_credentials
      changed_when: false
      failed_when: false
      no_log: true

    - name: Update PostgreSQL role password
      community.docker.docker_container_exec:
        container: "{{ postgresql_container_name }}"
        user: postgres
        argv:
          - psql
          - --username
          - "{{ postgresql_user }}"
          - --dbname
          - "{{ postgresql_database }}"
          - --set
          - ON_ERROR_STOP=1
        stdin: >-
          ALTER ROLE "{{ postgresql_user }}"
          WITH PASSWORD '{{ postgresql_password | replace("'", "''") }}';
      when: postgresql_desired_credentials.rc | default(1) != 0
      no_log: true

    - name: Verify reconciled PostgreSQL credentials
      community.docker.docker_container_exec:
        container: "{{ postgresql_container_name }}"
        user: postgres
        env:
          PGPASSWORD: "{{ postgresql_password }}"
        argv:
          - psql
          - --host
          - 127.0.0.1
          - --username
          - "{{ postgresql_user }}"
          - --dbname
          - "{{ postgresql_database }}"
          - --no-password
          - --command
          - SELECT 1;
      register: postgresql_reconciled_credentials
      changed_when: false
      failed_when: postgresql_reconciled_credentials.rc != 0
      no_log: true
