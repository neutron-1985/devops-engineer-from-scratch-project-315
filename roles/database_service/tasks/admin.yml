---
- name: Validate PostgreSQL configuration for host administration
  ansible.builtin.import_tasks: validate_firewall.yml

- name: Install PostgreSQL Python driver
  ansible.builtin.apt:
    name: "{{ postgresql_python_driver_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    owner: "{{ postgresql_container_uid }}"
    group: "{{ postgresql_container_uid }}"
    mode: "0700"

- name: Configure PostgreSQL firewall
  ansible.builtin.import_tasks: firewall.yml
