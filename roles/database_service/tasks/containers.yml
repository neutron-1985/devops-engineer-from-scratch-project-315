---
- name: Validate PostgreSQL configuration for container management
  ansible.builtin.import_tasks: validate_credentials.yml

- name: Run healthy PostgreSQL container
  community.docker.docker_container:
    name: "{{ postgresql_container_name }}"
    image: "{{ postgresql_image }}"
    state: healthy
    healthy_wait_timeout: 120
    restart_policy: always
    pull: missing
    network_mode: host
    volumes:
      - "{{ postgresql_data_dir }}:/var/lib/postgresql/data"
    env:
      POSTGRES_DB: "{{ postgresql_database }}"
      POSTGRES_USER: "{{ postgresql_user }}"
      POSTGRES_PASSWORD: "{{ postgresql_password }}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGPORT: "{{ postgresql_port }}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "{{ postgresql_user }}", "-d", "{{ postgresql_database }}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  no_log: true

- name: Reconcile PostgreSQL credentials
  ansible.builtin.import_tasks: reconcile_credentials.yml
