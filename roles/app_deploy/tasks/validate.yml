---
- name: Validate Docker image configuration
  ansible.builtin.assert:
    that:
      - app_image_repository | default('') | length > 0
    fail_msg: "app_image_repository must identify the Docker image repository."

- name: Validate production database configuration
  ansible.builtin.assert:
    that:
      - database_host | default('') | length > 0
      - database_name | default('') | length > 0
      - database_username | default('') | length > 0
      - database_password | default('') | length > 0
    fail_msg: "The prod profile requires PostgreSQL connection variables."
  when: app_profile == "prod"
  no_log: true

- name: Validate production object storage configuration
  ansible.builtin.assert:
    that:
      - app_s3_bucket | default('') | length > 0
      - app_s3_region | default('') | length > 0
      - app_s3_endpoint | default('') | length > 0
      - app_s3_access_key | default('') | length > 0
      - app_s3_secret_key | default('') | length > 0
    fail_msg: "The prod profile requires S3-compatible object storage variables."
  when: app_storage_backend == "s3"
  no_log: true
