---
- name: Validate object storage service selection
  ansible.builtin.import_tasks: validate.yml

- name: Validate selected object storage provider
  ansible.builtin.include_tasks: "{{ object_storage_service_provider }}/validate.yml"

- name: Configure object storage firewall
  ansible.builtin.import_tasks: firewall.yml
  when: object_storage_service_scope == 'host'

- name: Prepare selected object storage service configuration
  ansible.builtin.include_tasks:
    file: "{{ object_storage_service_provider }}/prepare_configuration.yml"
  when: object_storage_service_scope == 'host'

- name: Detect the object storage transition state
  ansible.builtin.import_tasks: application_transition/prepare.yml
  when: object_storage_service_scope == 'service'

- name: Prepare the selected provider and copy object storage data
  ansible.builtin.include_tasks: migration/prepare.yml
  when:
    - object_storage_service_scope == 'service'
    - object_storage_service_previous_provider in ['minio', 'rustfs']
    - object_storage_service_previous_provider != object_storage_service_provider

- name: Deploy and configure selected object storage service without migration
  ansible.builtin.include_tasks: "{{ object_storage_service_provider }}/service.yml"
  vars:
    object_storage_service_pull_image: true
    object_storage_service_configure_resources: true
  when:
    - object_storage_service_scope == 'service'
    - >-
      object_storage_service_previous_provider not in ['minio', 'rustfs'] or
      object_storage_service_previous_provider == object_storage_service_provider

- name: Pull application image before the object storage outage
  ansible.builtin.include_role:
    name: app_deploy
    tasks_from: pull_image
    apply:
      delegate_to: "{{ groups['production'] | first }}"
  when:
    - object_storage_service_scope == 'service'
    - object_storage_service_transition_required | bool

- name: Remember that the application image is already available
  ansible.builtin.set_fact:
    app_deploy_image_preloaded: true
  delegate_to: "{{ groups['production'] | first }}"
  delegate_facts: true
  when:
    - object_storage_service_scope == 'service'
    - object_storage_service_transition_required | bool

- name: Quiesce the application for the object storage transition
  ansible.builtin.import_tasks: application_transition/quiesce.yml
  when:
    - object_storage_service_scope == 'service'
    - object_storage_service_transition_required | bool

- name: Complete data migration and switch object storage providers
  ansible.builtin.include_tasks: migration/complete.yml
  when:
    - object_storage_service_scope == 'service'
    - object_storage_service_previous_provider in ['minio', 'rustfs']
    - object_storage_service_previous_provider != object_storage_service_provider

- name: Record the active object storage provider
  ansible.builtin.copy:
    content: "{{ object_storage_service_provider }}\n"
    dest: "{{ object_storage_service_provider_marker }}"
    mode: "0600"
  delegate_to: "{{ groups['production'] | first }}"
  when: object_storage_service_scope == 'service'
