---
- name: Pull MinIO image before stopping inactive storage
  community.docker.docker_image:
    name: "{{ minio_image }}"
    source: pull
    force_source: false
  when: object_storage_service_pull_image | bool

- name: Stop inactive RustFS container
  community.docker.docker_container:
    name: "{{ rustfs_container_name }}"
    state: absent
  when: object_storage_service_remove_inactive | bool

- name: Run MinIO container
  community.docker.docker_container:
    name: "{{ minio_container_name }}"
    image: "{{ minio_image }}"
    state: started
    detach: true
    restart_policy: always
    pull: missing
    network_mode: host
    command: server /data
    volumes:
      - "{{ minio_data_dir }}:/data"
    env:
      MINIO_ROOT_USER: "{{ minio_root_user }}"
      MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
      MINIO_ADDRESS: ":{{ minio_api_port }}"
      MINIO_CONSOLE_ADDRESS: ":9001"
      MINIO_BROWSER: "{{ 'on' if object_storage_service_console_enabled | bool else 'off' }}"
  no_log: true

- name: Wait until MinIO is ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ minio_api_port }}/minio/health/ready"
    status_code: 200
  register: minio_healthcheck
  retries: "{{ object_storage_service_healthcheck_retries }}"
  delay: "{{ object_storage_service_healthcheck_delay }}"
  until: minio_healthcheck.status == 200
  when: not ansible_check_mode

- name: Create MinIO bucket
  community.docker.docker_container:
    name: project-devops-minio-create-bucket
    image: "{{ minio_client_image }}"
    state: started
    detach: false
    cleanup: true
    pull: missing
    network_mode: host
    command:
      - mb
      - --ignore-existing
      - --region
      - "{{ minio_region }}"
      - "local/{{ minio_bucket }}"
    env:
      MC_HOST_local: "http://{{ minio_root_user }}:{{ minio_root_password }}@127.0.0.1:{{ minio_api_port }}"
  no_log: true
  when:
    - not ansible_check_mode
    - object_storage_service_configure_resources | bool

- name: Configure public read access for uploaded bulletin images
  community.docker.docker_container:
    name: project-devops-minio-configure-public-downloads
    image: "{{ minio_client_image }}"
    state: started
    detach: false
    cleanup: true
    pull: missing
    network_mode: host
    command:
      - anonymous
      - set
      - "{{ 'download' if minio_public_downloads | bool else 'none' }}"
      - "local/{{ minio_bucket }}/{{ minio_app_object_prefix }}"
    env:
      MC_HOST_local: "http://{{ minio_root_user }}:{{ minio_root_password }}@127.0.0.1:{{ minio_api_port }}"
  no_log: true
  when:
    - not ansible_check_mode
    - object_storage_service_configure_resources | bool

- name: Create or update MinIO application user
  community.docker.docker_container:
    name: project-devops-minio-configure-user
    image: "{{ minio_client_image }}"
    state: started
    detach: false
    cleanup: true
    pull: missing
    network_mode: host
    command:
      - admin
      - user
      - add
      - local
      - "{{ minio_app_access_key }}"
      - "{{ minio_app_secret_key }}"
    env:
      MC_HOST_local: "http://{{ minio_root_user }}:{{ minio_root_password }}@127.0.0.1:{{ minio_api_port }}"
  no_log: true
  when:
    - not ansible_check_mode
    - object_storage_service_configure_resources | bool

- name: Create or update MinIO application policy
  community.docker.docker_container:
    name: project-devops-minio-configure-policy
    image: "{{ minio_client_image }}"
    state: started
    detach: false
    cleanup: true
    pull: missing
    network_mode: host
    command:
      - admin
      - policy
      - create
      - local
      - "{{ minio_app_policy_name }}"
      - /config/application-policy.json
    volumes:
      - "{{ minio_app_policy_file }}:/config/application-policy.json:ro"
    env:
      MC_HOST_local: "http://{{ minio_root_user }}:{{ minio_root_password }}@127.0.0.1:{{ minio_api_port }}"
  no_log: true
  when:
    - not ansible_check_mode
    - object_storage_service_configure_resources | bool

- name: Attach application policy to MinIO application user
  community.docker.docker_container:
    name: project-devops-minio-attach-policy
    image: "{{ minio_client_image }}"
    state: started
    detach: false
    cleanup: true
    pull: missing
    network_mode: host
    command:
      - admin
      - policy
      - attach
      - local
      - "{{ minio_app_policy_name }}"
      - --user
      - "{{ minio_app_access_key }}"
    env:
      MC_HOST_local: "http://{{ minio_root_user }}:{{ minio_root_password }}@127.0.0.1:{{ minio_api_port }}"
  no_log: true
  when:
    - not ansible_check_mode
    - object_storage_service_configure_resources | bool
