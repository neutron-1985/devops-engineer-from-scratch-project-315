---
- name: Inspect application container before the S3 transition
  community.docker.docker_container_info:
    name: "{{ object_storage_service_application_container_name }}"
  delegate_to: "{{ groups['production'] | first }}"
  register: object_storage_service_application_container
  no_log: true

- name: Stop application for the final object storage transition
  community.docker.docker_container:
    name: "{{ object_storage_service_application_container_name }}"
    state: stopped
  delegate_to: "{{ groups['production'] | first }}"
  when: object_storage_service_application_container.exists

- name: Reset step 3 test bulletins before the initial S3 transition
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ database_port }}"
    login_db: "{{ database_name }}"
    login_user: "{{ database_username }}"
    login_password: "{{ database_password }}"
    query: TRUNCATE TABLE bulletins RESTART IDENTITY;
  delegate_to: "{{ groups['database'] | first }}"
  when: object_storage_service_initial_transition | bool
  no_log: true
