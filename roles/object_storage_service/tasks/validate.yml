---
- name: Validate selected object storage service scope
  ansible.builtin.assert:
    that:
      - object_storage_service_scope | default('') in ['host', 'service']
      - object_storage_service_provider | default('') in ['minio', 'rustfs']
      - object_storage_service_migration_port | int > 0
      - object_storage_service_migration_port | int <= 65535
      - object_storage_service_migration_port | string != object_storage_api_port | string
      - (object_storage_service_allowed_cidrs | type_debug) == 'list'
      - object_storage_service_allowed_cidrs | length > 0
      - (object_storage_service_previous_allowed_cidrs | type_debug) == 'list'
    fail_msg: >-
      object_storage_service_scope must be 'host' or 'service', and
      object_storage_service_provider must be 'minio' or 'rustfs'. Firewall
      allowlists and their saved state must be lists.
