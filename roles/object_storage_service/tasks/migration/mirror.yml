---
- name: Mirror object storage data to the selected provider
  community.docker.docker_container:
    name: project-devops-object-storage-migration
    image: "{{ minio_client_image }}"
    state: started
    detach: false
    cleanup: true
    pull: missing
    network_mode: host
    command:
      - mirror
      - --overwrite
      - --retry
      - "source/{{ object_storage_bucket }}"
      - "target/{{ object_storage_bucket }}"
    env:
      MC_HOST_source: >-
        http://{{ object_storage_admin_access_key }}:{{ object_storage_admin_secret_key }}@127.0.0.1:{{ object_storage_api_port }}
      MC_HOST_target: >-
        http://{{ object_storage_admin_access_key }}:{{ object_storage_admin_secret_key }}@127.0.0.1:{{ object_storage_service_migration_port }}
  no_log: true
  when: not ansible_check_mode
