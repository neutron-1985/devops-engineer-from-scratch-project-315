---
- name: Deploy migration target on the temporary S3 port
  ansible.builtin.include_tasks: >-
    {{ role_path }}/tasks/{{ object_storage_service_provider }}/service.yml
  vars:
    object_storage_service_remove_inactive: false
    object_storage_service_console_enabled: false
    object_storage_service_pull_image: true
    object_storage_service_configure_resources: true
    minio_api_port: "{{ object_storage_service_migration_port }}"
    rustfs_api_port: "{{ object_storage_service_migration_port }}"

- name: Copy object storage data while the application remains available
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/migration/mirror.yml"
