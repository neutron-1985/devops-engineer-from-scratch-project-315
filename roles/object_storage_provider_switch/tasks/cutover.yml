---
- name: Copy changes made during initial object storage synchronization
  ansible.builtin.include_role:
    name: object_storage_migration
  vars:
    object_storage_migration_source_address: >-
      127.0.0.1:{{ object_storage_api_port }}
    object_storage_migration_target_address: >-
      127.0.0.1:{{ object_storage_provider_switch_migration_port }}
    object_storage_migration_bucket: "{{ object_storage_bucket }}"
    object_storage_migration_access_key: "{{ object_storage_admin_access_key }}"
    object_storage_migration_secret_key: "{{ object_storage_admin_secret_key }}"

- name: Stop source object storage provider
  ansible.builtin.include_role:
    name: object_storage_deploy
    tasks_from: stop_inactive

- name: Switch target provider to primary S3 port
  ansible.builtin.include_role:
    name: object_storage_deploy
    tasks_from: deploy
  vars:
    object_storage_deploy_api_port: "{{ object_storage_api_port }}"
    object_storage_deploy_pull_image: false
    object_storage_deploy_console_enabled: true

