---
- name: Check object storage state file
  ansible.builtin.stat:
    path: "{{ object_storage_provider_switch_state_file }}"
  delegate_to: "{{ groups['production'] | first }}"
  register: object_storage_provider_switch_state_file_info

- name: Read object storage state file
  ansible.builtin.slurp:
    src: "{{ object_storage_provider_switch_state_file }}"
  delegate_to: "{{ groups['production'] | first }}"
  register: object_storage_provider_switch_state_file_content
  when: object_storage_provider_switch_state_file_info.stat.exists

- name: Normalize recorded object storage state
  ansible.builtin.set_fact:
    object_storage_provider_switch_recorded_state: >-
      {{
        (object_storage_provider_switch_state_file_content.content
         | b64decode | from_json)
        if object_storage_provider_switch_state_file_info.stat.exists
        else {
          'active_provider': '',
          'initial_s3_transition_complete': false
        }
      }}

- name: Validate recorded object storage state
  ansible.builtin.assert:
    that:
      - object_storage_provider_switch_recorded_state is mapping
      - >-
        (object_storage_provider_switch_recorded_state.active_provider
         | default('')) in ['minio', 'rustfs']
      - >-
        (object_storage_provider_switch_recorded_state.initial_s3_transition_complete
         | default(none) | type_debug) == 'bool'
    fail_msg: >-
      The object storage state file must contain a valid active provider
      and boolean initial transition status.
  when: object_storage_provider_switch_state_file_info.stat.exists

- name: Determine required transition operations
  ansible.builtin.set_fact:
    object_storage_provider_switch_initial_transition: >-
      {{ not (object_storage_provider_switch_recorded_state.initial_s3_transition_complete
              | default(false)) }}
    object_storage_provider_switch_provider_changed: >-
      {{ (object_storage_provider_switch_recorded_state.active_provider
          | default('')) in ['minio', 'rustfs'] and
         (object_storage_provider_switch_recorded_state.active_provider
          | default('')) != object_storage_provider }}
    object_storage_provider_switch_transition_required: >-
      {{ not (object_storage_provider_switch_recorded_state.initial_s3_transition_complete
              | default(false)) or
         (object_storage_provider_switch_recorded_state.active_provider
          | default('')) != object_storage_provider }}

