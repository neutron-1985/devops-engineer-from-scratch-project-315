---
- name: Validate Nginx reverse proxy configuration
  ansible.builtin.assert:
    that:
      - nginx_routes_config_pattern | length > 0
      - nginx_bootstrap_config_path | length > 0
      - nginx_virtual_hosts is sequence
      - nginx_virtual_hosts | length > 0
    fail_msg: Nginx reverse proxy requires managed config paths and discovered virtual hosts.

- name: Validate Nginx reverse proxy virtual hosts
  ansible.builtin.assert:
    that:
      - item.server_name | default('') | length > 0
      - item.config_path | default('') | length > 0
      - item.app_upstream | default('') is match('^http://')
    fail_msg: Each Nginx virtual host requires a server name and an HTTP application upstream.
  loop: "{{ nginx_virtual_hosts }}"
  loop_control:
    label: "{{ item.name | default(item.server_name | default('unknown')) }}"
