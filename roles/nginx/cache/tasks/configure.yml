---
- name: Create Nginx static cache directory
  ansible.builtin.file:
    path: "{{ nginx_static_cache_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"

- name: Create Nginx uploads cache directory
  ansible.builtin.file:
    path: "{{ nginx_uploads_cache_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"

- name: Ensure Nginx owns existing cache content
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true
  loop:
    - "{{ nginx_static_cache_path }}"
    - "{{ nginx_uploads_cache_path }}"

- name: Add cache zones and cached locations
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_main_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx after cache configuration

- name: Validate Nginx cache configuration
  ansible.builtin.command: nginx -t
  changed_when: false
