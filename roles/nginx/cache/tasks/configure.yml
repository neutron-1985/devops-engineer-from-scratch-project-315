---
- name: Prepare Nginx cache directories
  ansible.builtin.import_tasks: directories.yml

- name: Add cache zones and cached locations
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_main_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx after cache configuration

- name: Validate Nginx cache configuration
  ansible.builtin.command: nginx -t
  changed_when: false
