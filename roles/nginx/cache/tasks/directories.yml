---
- name: Build Nginx cache directory list
  ansible.builtin.set_fact:
    nginx_cache_directories: >-
      {{ (nginx_virtual_hosts | map(attribute='static_cache_path') | list)
         + (nginx_virtual_hosts
            | selectattr('uploads_enabled', 'equalto', true)
            | map(attribute='uploads_cache_path') | list) }}

- name: Create Nginx cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nginx_container_uid }}"
    group: "{{ nginx_container_gid }}"
    mode: "0750"
  loop: "{{ nginx_cache_directories }}"

- name: Ensure Nginx owns existing cache content
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nginx_container_uid }}"
    group: "{{ nginx_container_gid }}"
    recurse: true
  loop: "{{ nginx_cache_directories }}"
