---
- name: Inspect host services before Nginx container migration
  ansible.builtin.service_facts:

- name: Ensure Nginx container image is available
  community.docker.docker_image:
    name: "{{ nginx_image }}"
    source: pull

- name: Stop and disable host Nginx service
  ansible.builtin.systemd:
    name: nginx.service
    state: stopped
    enabled: false
  when: ansible_facts.services.get('nginx.service') is not none

- name: Remove host Nginx packages
  ansible.builtin.apt:
    name:
      - nginx
      - nginx-common
    state: absent
    update_cache: true
    cache_valid_time: 3600
