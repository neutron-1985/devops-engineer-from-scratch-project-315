---
- name: Remove selected application containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  when: environment_reset_docker_info.rc == 0
  loop:
    - "{{ app_container_name }}"
    - "{{ app_container_name }}-previous"
    - "{{ app_container_name }}-rollback"
    - "{{ database_migration_container_name }}"

- name: Remove selected application data
  ansible.builtin.file:
    path: "{{ app_data_dir }}"
    state: absent

- name: Clear selected environment Nginx caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ nginx_static_cache_path }}"
    - "{{ nginx_uploads_cache_path }}"

- name: Check whether the Nginx runtime user exists
  ansible.builtin.command: id -u www-data
  register: environment_reset_nginx_user
  check_mode: false
  changed_when: false
  failed_when: false

- name: Recreate selected environment Nginx cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"
  loop:
    - "{{ nginx_static_cache_path }}"
    - "{{ nginx_uploads_cache_path }}"
  when: environment_reset_nginx_user.rc == 0
