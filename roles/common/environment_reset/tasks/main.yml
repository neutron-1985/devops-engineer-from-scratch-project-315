---
- name: Validate environment reset request
  ansible.builtin.assert:
    that:
      - environment_reset_confirm | bool
      - reset_mode in ['soft', 'hard']
    fail_msg: >-
      Environment reset requires explicit confirmation and reset_mode set to
      soft or hard. Hard mode destroys persistent resources of the selected
      environment.

- name: Check whether Docker daemon is available
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{{ '{{' }}.ServerVersion{{ '}}' }}"
  register: environment_reset_docker_info
  check_mode: false
  changed_when: false
  failed_when: false

- name: Discover existing containers
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --format
      - "{{ '{{' }}.Names{{ '}}' }}"
  register: environment_reset_container_names
  check_mode: false
  changed_when: false
  failed_when: false
  when: environment_reset_docker_info.rc == 0

- name: Check whether UFW is available
  ansible.builtin.command:
    argv:
      - ufw
      - status
  register: environment_reset_ufw_info
  check_mode: false
  changed_when: false
  failed_when: false
  when: reset_mode == 'hard'

- name: Reset selected application resources
  ansible.builtin.include_tasks: application.yml
  when: "'application' in group_names"

- name: Reset selected PostgreSQL resources
  ansible.builtin.include_tasks: database.yml
  when: "'database' in group_names"

- name: Reset selected object-storage resources
  ansible.builtin.include_tasks: object_storage.yml
  when: "'object_storage' in group_names"
