---
infrastructure_reset_project_container_pattern: >-
  ^project-devops-(deploy|postgresql|minio|rustfs|object-storage|nginx|certbot)(-|$)

infrastructure_reset_project_path_specs:
  - path: /var/lib
    patterns:
      - "project-devops-deploy*"
      - "project-devops-postgresql*"
      - "project-devops-minio*"
      - "project-devops-rustfs*"
    file_type: directory
  - path: /var/log
    patterns:
      - "project-devops-deploy*"
      - "project-devops-postgresql*"
      - "project-devops-minio*"
      - "project-devops-rustfs*"
      - "project-devops-nginx*"
      - "project-devops-certbot*"
    file_type: directory
  - path: "{{ ansible_local_facts_dir }}"
    patterns:
      - "postgresql_firewall*.fact"
      - "object_storage_firewall*.fact"
    file_type: file
  - path: /etc/logrotate.d
    patterns:
      - "project-devops-deploy*"
      - "project-devops-minio*"
      - "project-devops-nginx*"
    file_type: file

infrastructure_reset_nginx_config_paths:
  - "{{ nginx_bootstrap_config_path }}"

infrastructure_reset_nginx_cache_paths:
  - "{{ nginx_cache_root_dir }}/dev"
  - "{{ nginx_cache_root_dir }}/stage"
  - "{{ nginx_cache_root_dir }}/prod"
