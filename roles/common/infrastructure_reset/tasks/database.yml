---
- name: Remove every environment PostgreSQL container
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  when: infrastructure_reset_docker_info.rc == 0
  loop:
    - project-devops-postgresql-dev
    - project-devops-postgresql-stage
    - project-devops-postgresql

- name: Discover every environment PostgreSQL data directory
  ansible.builtin.find:
    paths: /var/lib
    patterns: project-devops-postgresql*
    file_type: directory
    recurse: false
  register: infrastructure_reset_postgresql_data_directories

- name: Remove every environment PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ infrastructure_reset_postgresql_data_directories.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Discover every environment PostgreSQL firewall local fact
  ansible.builtin.find:
    paths: "{{ ansible_local_facts_dir }}"
    patterns: postgresql_firewall*.fact
    file_type: file
    recurse: false
  register: infrastructure_reset_postgresql_firewall_facts

- name: Remove every environment PostgreSQL firewall local fact
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ infrastructure_reset_postgresql_firewall_facts.files }}"
  loop_control:
    label: "{{ item.path }}"
