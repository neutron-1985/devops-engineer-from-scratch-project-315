---
- name: Remove application release containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  when: infrastructure_reset_docker_info.rc == 0
  loop:
    - "{{ app_container_name }}"
    - "{{ app_container_name }}-previous"
    - "{{ app_container_name }}-rollback"

- name: Discover every environment application data directory
  ansible.builtin.find:
    paths: /var/lib
    patterns: project-devops-deploy*
    file_type: directory
    recurse: false
  register: infrastructure_reset_application_data_directories

- name: Remove every environment application data directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ infrastructure_reset_application_data_directories.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove application logs
  ansible.builtin.file:
    path: "{{ infrastructure_reset_app_log_dir }}"
    state: absent
