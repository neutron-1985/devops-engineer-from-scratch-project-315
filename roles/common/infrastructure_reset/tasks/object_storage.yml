---
- name: Remove every environment object-storage container
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  loop: "{{ infrastructure_reset_object_storage_container_names }}"
  when: infrastructure_reset_docker_info.rc == 0

- name: Remove legacy object-storage volumes
  community.docker.docker_volume:
    name: "{{ item }}"
    state: absent
  loop: "{{ infrastructure_reset_legacy_object_storage_volume_names }}"
  when: infrastructure_reset_docker_info.rc == 0

- name: Discover every environment MinIO data directory
  ansible.builtin.find:
    paths: /var/lib
    patterns: project-devops-minio*
    file_type: directory
    recurse: false
  register: infrastructure_reset_minio_directories

- name: Remove every environment MinIO data directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ infrastructure_reset_minio_directories.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Discover every environment RustFS data directory
  ansible.builtin.find:
    paths: /var/lib
    patterns: project-devops-rustfs*
    file_type: directory
    recurse: false
  register: infrastructure_reset_rustfs_directories

- name: Remove every environment RustFS data directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ infrastructure_reset_rustfs_directories.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Discover every environment object-storage firewall local fact
  ansible.builtin.find:
    paths: "{{ ansible_local_facts_dir }}"
    patterns: object_storage_firewall*.fact
    file_type: file
    recurse: false
  register: infrastructure_reset_object_storage_firewall_facts

- name: Remove every environment object-storage firewall local fact
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ infrastructure_reset_object_storage_firewall_facts.files }}"
  loop_control:
    label: "{{ item.path }}"
