---
- name: Validate full project reset request
  ansible.builtin.assert:
    that:
      - infrastructure_reset_confirm | bool
      - reset_mode in ['soft', 'hard']
    fail_msg: >-
      Full project reset requires explicit confirmation and reset_mode set to
      soft or hard. Hard mode destroys persistent resources owned by this
      project but preserves the container runtime and unrelated workloads.

- name: Check whether Docker daemon is available
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{{ '{{' }}.ServerVersion{{ '}}' }}"
  register: infrastructure_reset_docker_info
  check_mode: false
  changed_when: false
  failed_when: false

- name: Discover project containers
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --format
      - "{{ '{{' }}.Names{{ '}}' }}"
  register: infrastructure_reset_container_scan
  check_mode: false
  changed_when: false
  failed_when: false
  when: infrastructure_reset_docker_info.rc == 0

- name: Stop or remove project containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: "{{ 'stopped' if reset_mode == 'soft' else 'absent' }}"
    keep_volumes: true
  loop: >-
    {{ infrastructure_reset_container_scan.stdout_lines | default([])
       | select('match', infrastructure_reset_project_container_pattern)
       | list }}
  when: infrastructure_reset_docker_info.rc == 0

- name: Remove project-owned persistent resources
  ansible.builtin.import_tasks: project_paths.yml
  when: reset_mode == 'hard'

- name: Remove shared project gateway resources
  ansible.builtin.import_tasks: common.yml
  when:
    - reset_mode == 'hard'
    - "'application' in group_names"
