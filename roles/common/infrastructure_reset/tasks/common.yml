---
- name: Stop and disable containerized Certbot renewal timer
  ansible.builtin.systemd:
    name: "{{ certbot_renewal_timer_unit }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Remove containerized Certbot renewal units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - "{{ certbot_renewal_service_unit }}"
    - "{{ certbot_renewal_timer_unit }}"

- name: Reload systemd after Certbot renewal removal
  ansible.builtin.systemd:
    daemon_reload: true

- name: Remove managed project Nginx configurations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ infrastructure_reset_nginx_config_paths }}"

- name: Inspect managed project Nginx route configurations
  ansible.builtin.find:
    paths: "{{ nginx_config_dir }}"
    patterns: "{{ nginx_routes_config_pattern }}"
    file_type: file
  register: infrastructure_reset_nginx_route_configs

- name: Remove managed project Nginx route configurations
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ infrastructure_reset_nginx_route_configs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove project Nginx caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ infrastructure_reset_nginx_cache_paths }}"
