---
- name: Require distinct provisioning and deployment users
  ansible.builtin.assert:
    that:
      - ssh_inventory.provision_user | default('') | length > 0
      - ssh_inventory.deploy_user | default('') | length > 0
      - (ssh_inventory.deploy_user | default('')) != (ssh_inventory.provision_user | default(''))
    fail_msg: >-
      deployment_access requires non-empty and distinct
      ssh_inventory.provision_user and ssh_inventory.deploy_user values.
