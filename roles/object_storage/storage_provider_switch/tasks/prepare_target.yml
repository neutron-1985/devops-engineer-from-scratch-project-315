---
- name: Deploy and provision migration target on temporary S3 port
  ansible.builtin.include_role:
    name: storage_deploy
    tasks_from: deploy
  vars:
    object_storage_deploy_api_port: "{{ object_storage_provider_switch_migration_port }}"
    object_storage_deploy_console_enabled: false

- name: Copy object storage data while application remains available
  ansible.builtin.include_tasks: synchronize.yml
