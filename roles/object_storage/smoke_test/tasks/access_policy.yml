---
- name: Verify application delete restriction
  delegate_to: "{{ object_storage_inventory_host }}"
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  block:
    - name: Attempt to delete object with application credentials
      community.docker.docker_container:
        name: project-devops-object-storage-smoke-forbidden-delete
        image: "{{ object_storage_client_image }}"
        state: started
        detach: false
        pull: missing
        network_mode: host
        command:
          - --json
          - rm
          - --force
          - "app/{{ object_storage_bucket }}/{{ object_storage_smoke_upload.json.key }}"
        env:
          MC_HOST_app: >-
            http://{{ object_storage_access_key }}:{{ object_storage_secret_key }}@127.0.0.1:{{ object_storage_api_port }}
      register: object_storage_smoke_forbidden_delete
      changed_when: false
      failed_when: >-
        (object_storage_smoke_forbidden_delete.status | default(0)) == 0 or
        'AccessDenied' not in
        (object_storage_smoke_forbidden_delete.container.Output | default(''))
      no_log: true

  always:
    - name: Remove object storage permission-test container
      community.docker.docker_container:
        name: project-devops-object-storage-smoke-forbidden-delete
        state: absent
        force_kill: true
