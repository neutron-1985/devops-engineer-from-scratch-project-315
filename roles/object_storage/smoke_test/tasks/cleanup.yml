---
- name: Remove smoke-test object with object storage administrative credentials
  community.docker.docker_container:
    name: object-storage-smoke-cleanup
    image: "{{ object_storage_client_image }}"
    state: started
    detach: false
    cleanup: true
    pull: missing
    network_mode: host
    command:
      - rm
      - --force
      - "local/{{ object_storage_bucket }}/{{ object_storage_smoke_upload.json.key }}"
    env:
      MC_HOST_local: >-
        http://{{ object_storage_admin_access_key }}:{{ object_storage_admin_secret_key }}@127.0.0.1:{{ object_storage_api_port }}
  delegate_to: "{{ object_storage_inventory_host }}"
  remote_user: "{{ vault_inventory.deploy_user }}"
  become: false
  no_log: true
  when:
    - object_storage_smoke_upload is defined
    - object_storage_smoke_upload.json is defined
    - object_storage_smoke_upload.json.key is defined
