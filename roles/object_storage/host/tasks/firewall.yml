---
- name: Allow object storage access from configured clients
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "{{ object_storage_api_port }}:{{ object_storage_console_port }}"
    src: "{{ item }}"
    comment: "{{ object_storage_host_firewall_comment }}"
  loop: "{{ object_storage_host_allowed_cidrs }}"

- name: Ensure obsolete API-only object storage rules are absent
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "{{ object_storage_api_port }}"
    src: "{{ item }}"
    comment: "{{ object_storage_host_firewall_comment }}"
    delete: true
  loop: >-
    {{
      object_storage_host_previous_allowed_cidrs
      | union(object_storage_host_allowed_cidrs)
      | unique
    }}

- name: Revoke object storage access from removed allowlist entries
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "{{ object_storage_api_port }}:{{ object_storage_console_port }}"
    src: "{{ item }}"
    comment: "{{ object_storage_host_firewall_comment }}"
    delete: true
  loop: >-
    {{ object_storage_host_previous_allowed_cidrs
       | difference(object_storage_host_allowed_cidrs) }}

- name: Create Ansible local facts directory for object storage
  ansible.builtin.file:
    path: "{{ ansible_local_facts_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Save current object storage firewall state as a local fact
  ansible.builtin.copy:
    content: >-
      {{ object_storage_host_allowed_cidrs | unique | sort | to_nice_json }}
    dest: "{{ object_storage_host_fact_file }}"
    owner: root
    group: root
    mode: "0644"

