---
minio_image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
minio_client_image: minio/mc:RELEASE.2025-08-13T08-35-41Z
minio_container_name: project-devops-minio
minio_volume_name: project-devops-minio-data

minio_api_port: "9000"
minio_bucket: bulletin-images
minio_region: us-east-1

minio_root_user: bulletins-storage
minio_root_password: ""

minio_app_object_prefix: bulletins
minio_app_policy_name: bulletins-app-read-write
minio_app_access_key: bulletins-app
minio_app_secret_key: ""

minio_config_dir: /var/lib/project-devops-minio/config
minio_app_policy_file: "{{ minio_config_dir }}/application-policy.json"

minio_allowed_cidrs: []
minio_previous_allowed_cidrs: "{{ ansible_local.minio_firewall | default([]) }}"

minio_fact_dir: /etc/ansible/facts.d
minio_fact_file: "{{ minio_fact_dir }}/minio_firewall.fact"
minio_firewall_comment: project-devops-minio
