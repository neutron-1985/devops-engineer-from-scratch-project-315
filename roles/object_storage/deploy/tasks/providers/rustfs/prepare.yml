---
- name: Create RustFS data directory
  ansible.builtin.file:
    path: "{{ rustfs_data_dir }}"
    state: directory
    owner: "{{ rustfs_container_uid }}"
    group: "{{ rustfs_container_gid }}"
    mode: "0750"

- name: Create RustFS client configuration directory
  ansible.builtin.file:
    path: "{{ rustfs_client_config_dir }}"
    state: directory
    owner: "{{ rustfs_client_uid }}"
    group: "{{ rustfs_client_gid }}"
    mode: "0700"

- name: Create RustFS configuration directory
  ansible.builtin.file:
    path: "{{ rustfs_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render least-privilege RustFS application policy
  ansible.builtin.template:
    src: application-policy.json.j2
    dest: "{{ rustfs_app_policy_file }}"
    owner: "{{ rustfs_client_uid }}"
    group: "{{ rustfs_client_gid }}"
    mode: "0600"

