---
- name: Configure MinIO resources
  module_defaults:
    community.docker.docker_container:
      image: "{{ object_storage_client_image }}"
      state: started
      detach: false
      cleanup: true
      pull: missing
      network_mode: host
      env:
        MC_HOST_local: >-
          http://{{ object_storage_admin_access_key }}:{{ object_storage_admin_secret_key }}@127.0.0.1:{{ object_storage_deploy_api_port }}
  when: not ansible_check_mode
  no_log: true

  block:
    - name: Create MinIO bucket
      community.docker.docker_container:
        name: "{{ minio_container_name }}-create-bucket"
        command:
          - mb
          - --ignore-existing
          - --region
          - "{{ object_storage_region }}"
          - "local/{{ object_storage_bucket }}"

    - name: Configure public read access for MinIO bulletin images
      community.docker.docker_container:
        name: "{{ minio_container_name }}-configure-public-downloads"
        command:
          - anonymous
          - set
          - "{{ 'download' if object_storage_public_downloads | bool else 'none' }}"
          - "local/{{ object_storage_bucket }}/{{ object_storage_object_prefix }}"

    - name: Create or update MinIO application user
      community.docker.docker_container:
        name: "{{ minio_container_name }}-configure-user"
        command:
          - admin
          - user
          - add
          - local
          - "{{ object_storage_access_key }}"
          - "{{ object_storage_secret_key }}"

    - name: Create or update MinIO application policy
      community.docker.docker_container:
        name: "{{ minio_container_name }}-configure-policy"
        command:
          - admin
          - policy
          - create
          - local
          - "{{ object_storage_policy_name }}"
          - /config/application-policy.json
        volumes:
          - "{{ minio_app_policy_file }}:/config/application-policy.json:ro"

    - name: Attach application policy to MinIO application user
      community.docker.docker_container:
        name: "{{ minio_container_name }}-attach-policy"
        command:
          - admin
          - policy
          - attach
          - local
          - "{{ object_storage_policy_name }}"
          - --user
          - "{{ object_storage_access_key }}"

