---
object_storage_deploy_api_port: "{{ object_storage_api_port }}"
object_storage_deploy_console_enabled: true
object_storage_console_bind_address: 127.0.0.1
object_storage_public_downloads: true
object_storage_healthcheck_retries: 20
object_storage_healthcheck_delay: 2
object_storage_container_healthcheck_interval: 10s
object_storage_container_healthcheck_timeout: 5s
object_storage_container_healthcheck_retries: 5
object_storage_container_healthcheck_start_period: 20s
object_storage_log_driver: json-file
object_storage_log_options:
  max-size: 10m
  max-file: "5"

minio_image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
minio_container_uid: "10001"
minio_container_gid: "10001"
minio_log_dir: /var/log/project-devops-minio
minio_container_log_dir: /logs
minio_container_log_file: "{{ minio_container_log_dir }}/minio.log"
minio_logrotate_config_path: "/etc/logrotate.d/{{ minio_container_name }}"
minio_logrotate_size: 10M
minio_logrotate_rotate: 5
minio_container_entrypoint:
  - /bin/sh
  - -c
  - >-
    exec minio server /data
    >> "$MINIO_LOG_FILE" 2>&1

rustfs_image: rustfs/rustfs:1.0.0-beta.3
rustfs_client_image: rustfs/rc:v0.1.27
rustfs_container_uid: "10001"
rustfs_container_gid: "10001"
rustfs_container_log_dir: /logs

