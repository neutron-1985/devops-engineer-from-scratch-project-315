---
- name: Validate firewall configuration
  ansible.builtin.assert:
    that:
      - (vault_inventory.ssh_port | string) is match('^[0-9]+$')
      - firewall_allowed_tcp_ports | intersect(firewall_revoked_tcp_ports) | length == 0
      - vault_inventory.ssh_port not in firewall_revoked_tcp_ports
    fail_msg: >-
      firewall requires a numeric SSH port, disjoint allowed and revoked TCP
      port lists, and an SSH port that is not revoked.
