---
- name: Create Certbot deploy-hook directory
  ansible.builtin.file:
    path: "{{ tls_certificate_renewal_deploy_hook | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Nginx reload hook for renewed certificates
  ansible.builtin.copy:
    src: reload-nginx
    dest: "{{ tls_certificate_renewal_deploy_hook }}"
    owner: root
    group: root
    mode: "0755"

- name: Enable and start automatic certificate renewal
  ansible.builtin.systemd:
    name: "{{ tls_certificate_renewal_timer_unit }}"
    state: started
    enabled: true
    daemon_reload: true
