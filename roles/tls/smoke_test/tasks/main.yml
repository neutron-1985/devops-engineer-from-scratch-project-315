---
- name: Verify HTTPS, TLS policy, and renewal timer
  when: not ansible_check_mode
  block:
    - name: Request HTTP without following redirects
      ansible.builtin.uri:
        url: "{{ tls_smoke_http_url }}"
        method: HEAD
        follow_redirects: none
        status_code: 301
      delegate_to: localhost
      become: false
      register: tls_smoke_http

    - name: Validate HTTPS redirect target
      ansible.builtin.assert:
        that:
          - tls_smoke_http.location == tls_smoke_https_url
        fail_msg: "HTTP does not redirect to the expected HTTPS endpoint."

    - name: Verify HTTPS endpoint and certificate trust
      ansible.builtin.uri:
        url: "{{ tls_smoke_https_url }}"
        method: HEAD
        status_code: 200
        validate_certs: true
      delegate_to: localhost
      become: false

    - name: Verify supported TLS protocols
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - "{{ tls_smoke_domain }}:443"
          - -servername
          - "{{ tls_smoke_domain }}"
          - "-{{ item }}"
          - -brief
        stdin: ""
      loop:
        - tls1_2
        - tls1_3
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Verify a modern TLS 1.2 cipher
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - "{{ tls_smoke_domain }}:443"
          - -servername
          - "{{ tls_smoke_domain }}"
          - -tls1_2
          - -cipher
          - ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
          - -brief
        stdin: ""
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Verify deprecated TLS protocols are rejected
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - "{{ tls_smoke_domain }}:443"
          - -servername
          - "{{ tls_smoke_domain }}"
          - "-{{ item }}"
          - -cipher
          - DEFAULT:@SECLEVEL=0
          - -brief
        stdin: ""
      loop:
        - tls1
        - tls1_1
      delegate_to: localhost
      become: false
      register: tls_smoke_deprecated_protocol
      changed_when: false
      failed_when: tls_smoke_deprecated_protocol.rc == 0

    - name: Verify a legacy TLS 1.2 cipher is rejected
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - "{{ tls_smoke_domain }}:443"
          - -servername
          - "{{ tls_smoke_domain }}"
          - -tls1_2
          - -cipher
          - ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:@SECLEVEL=0
          - -brief
        stdin: ""
      delegate_to: localhost
      become: false
      register: tls_smoke_legacy_cipher
      changed_when: false
      failed_when: tls_smoke_legacy_cipher.rc == 0

    - name: Check containerized Certbot timer state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ tls_smoke_certbot_timer_unit }}"
      changed_when: false

    - name: Check containerized Certbot timer enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ tls_smoke_certbot_timer_unit }}"
      changed_when: false
