---
- name: Install Nginx package
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Create Nginx cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"
  loop:
    - "{{ nginx_static_cache_path }}"
    - "{{ nginx_uploads_cache_path }}"
