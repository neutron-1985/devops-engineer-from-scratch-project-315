---
- name: Replace the text response with the reverse proxy
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_main_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx reverse proxy

- name: Validate Nginx reverse proxy configuration
  ansible.builtin.command: nginx -t
  changed_when: false
