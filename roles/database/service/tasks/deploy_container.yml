---
- name: Deploy healthy PostgreSQL container
  community.docker.docker_container:
    name: "{{ postgresql_container_name }}"
    image: "{{ postgresql_image }}"
    state: healthy
    healthy_wait_timeout: 120
    restart_policy: always
    pull: missing
    network_mode: host
    log_driver: "{{ postgresql_log_driver }}"
    log_options: "{{ postgresql_log_options }}"
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - "log_directory={{ postgresql_container_log_dir }}"
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_truncate_on_rotation=on
    volumes:
      - "{{ postgresql_data_dir }}:/var/lib/postgresql/data"
      - "{{ postgresql_log_dir }}:{{ postgresql_container_log_dir }}"
    env:
      POSTGRES_DB: "{{ postgresql_database }}"
      POSTGRES_USER: "{{ postgresql_user }}"
      POSTGRES_PASSWORD: "{{ postgresql_password }}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGPORT: "{{ postgresql_port }}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "{{ postgresql_user }}", "-d", "{{ postgresql_database }}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  no_log: true
