---
- name: Reconcile PostgreSQL credentials
  when: not ansible_check_mode
  block:
    - name: Check whether desired PostgreSQL credentials are active
      community.postgresql.postgresql_ping:
        login_host: 127.0.0.1
        login_port: "{{ postgresql_port }}"
        login_db: "{{ postgresql_database }}"
        login_user: "{{ postgresql_user }}"
        login_password: "{{ postgresql_password }}"
      register: postgresql_desired_credentials
      failed_when: false
      no_log: true

    - name: Update PostgreSQL role password
      community.docker.docker_container_exec:
        container: "{{ postgresql_container_name }}"
        user: postgres
        argv: [psql, --username, "{{ postgresql_user }}", --dbname,
          "{{ postgresql_database }}", --set, ON_ERROR_STOP=1]
        stdin: >-
          ALTER ROLE "{{ postgresql_user }}"
          WITH PASSWORD '{{ postgresql_password | replace("'", "''") }}';
      when: not (postgresql_desired_credentials.is_available | default(false))
      no_log: true

    - name: Verify reconciled PostgreSQL credentials
      community.postgresql.postgresql_ping:
        login_host: 127.0.0.1
        login_port: "{{ postgresql_port }}"
        login_db: "{{ postgresql_database }}"
        login_user: "{{ postgresql_user }}"
        login_password: "{{ postgresql_password }}"
      register: postgresql_reconciled_credentials
      failed_when: not (postgresql_reconciled_credentials.is_available | default(false))
      no_log: true
