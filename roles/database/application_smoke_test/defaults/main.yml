---
application_database_smoke_database_host: "{{ groups['database'] | first }}"
application_database_smoke_login_host: 127.0.0.1
application_database_smoke_port: "{{ database_port }}"
application_database_smoke_database: "{{ database_name }}"
application_database_smoke_user: "{{ database_username }}"
application_database_smoke_password: "{{ database_password }}"
application_database_smoke_relation: public.bulletins
application_database_smoke_readiness_url: >-
  http://127.0.0.1:{{ app_management_port }}/actuator/health/readiness
application_database_smoke_app_url: "http://127.0.0.1:{{ app_public_port }}/"
application_database_smoke_retries: 10
application_database_smoke_delay: 3
