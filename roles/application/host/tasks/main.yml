---
- name: Create application persistent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ app_data_dir }}"
      owner: "{{ ssh_inventory.deploy_user }}"
      group: docker
      mode: "0755"
    - path: "{{ app_uploads_dir }}"
      owner: "{{ app_container_uid }}"
      group: "{{ app_container_gid }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"
