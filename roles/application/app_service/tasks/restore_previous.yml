---
- name: Remove failed application candidate
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
    force_kill: true

- name: Restore previous application container name
  ansible.builtin.command: >-
    docker rename {{ app_previous_container_name }} {{ app_container_name }}
  changed_when: true

- name: Start restored application container
  ansible.builtin.command: "docker start {{ app_container_name }}"
  changed_when: true

- name: Verify restored application container
  ansible.builtin.include_tasks: verify_container.yml
