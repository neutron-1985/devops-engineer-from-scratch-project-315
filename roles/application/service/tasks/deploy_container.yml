---
- name: Initialize application deployment transaction
  ansible.builtin.set_fact:
    app_previous_preserved: false
    app_active_stopped: false

- name: Inspect active application container
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: app_active_container
  no_log: true

- name: Inspect previous application container
  community.docker.docker_container_info:
    name: "{{ app_previous_container_name }}"
  register: app_previous_container
  no_log: true

- name: Recover previous container after interrupted deployment
  when:
    - not ansible_check_mode
    - not app_active_container.exists
    - app_previous_container.exists
  block:
    - name: Recover previous application container name
      ansible.builtin.command: >-
        docker rename {{ app_previous_container_name }} {{ app_container_name }}
      changed_when: true

    - name: Start recovered application container
      ansible.builtin.command: "docker start {{ app_container_name }}"
      changed_when: true

- name: Refresh active application container state
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: app_active_container
  no_log: true

- name: Refresh previous application container state
  community.docker.docker_container_info:
    name: "{{ app_previous_container_name }}"
  register: app_previous_container
  no_log: true

- name: Check candidate left by an interrupted deployment
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_management_port }}/actuator/health/readiness"
    status_code: 200
  register: app_interrupted_candidate_check
  retries: "{{ app_healthcheck_retries }}"
  delay: "{{ app_healthcheck_delay }}"
  until: app_interrupted_candidate_check.status == 200
  failed_when: false
  when:
    - not ansible_check_mode
    - not app_active_stop_expected | bool
    - app_active_container.exists
    - app_previous_container.exists

- name: Restore previous runtime after interrupted unhealthy deployment
  ansible.builtin.include_tasks: restore_previous.yml
  when:
    - not ansible_check_mode
    - not app_active_stop_expected | bool
    - app_active_container.exists
    - app_previous_container.exists
    - app_interrupted_candidate_check.status | default(-1) != 200

- name: Inspect deployable active application container
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: app_active_container
  no_log: true

- name: Plan application container update
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ app_image }}"
    state: started
    restart_policy: always
    entrypoint: "{{ app_container_entrypoint }}"
    pull: missing
    log_driver: "{{ app_log_driver }}"
    log_options: "{{ app_log_options }}"
    healthcheck: "{{ app_container_healthcheck }}"
    ports:
      - "{{ app_bind_address }}:{{ app_public_port }}:8080"
      - "{{ app_management_bind_address }}:{{ app_management_port }}:{{ app_container_management_port }}"
    volumes:
      - "{{ app_uploads_dir }}:{{ app_container_uploads_dir }}"
      - "{{ app_log_dir }}:{{ app_container_log_dir }}"
    env: "{{ app_common_environment | combine(app_external_services_environment) }}"
  check_mode: true
  register: app_candidate_plan
  no_log: true

- name: Replace application runtime transactionally
  when:
    - not ansible_check_mode
    - app_candidate_plan.changed
  block:
    - name: Record application restart start time
      ansible.builtin.command: date +%s
      register: app_restart_started_at
      changed_when: false

    - name: Remove obsolete previous application container
      community.docker.docker_container:
        name: "{{ app_previous_container_name }}"
        state: absent
        force_kill: true
      when: app_active_container.exists

    - name: Stop active application container
      ansible.builtin.command: >-
        docker stop -t {{ app_container_stop_timeout }} {{ app_container_name }}
      changed_when: true
      when:
        - app_active_container.exists
        - app_active_container.container.State.Running | bool

    - name: Remember stopped active runtime
      ansible.builtin.set_fact:
        app_active_stopped: true
      when: app_active_container.exists

    - name: Preserve complete active runtime as previous container
      ansible.builtin.command: >-
        docker rename {{ app_container_name }} {{ app_previous_container_name }}
      changed_when: true
      when: app_active_container.exists

    - name: Remember preserved previous runtime
      ansible.builtin.set_fact:
        app_previous_preserved: true
      when: app_active_container.exists

    - name: Run application candidate
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: always
        entrypoint: "{{ app_container_entrypoint }}"
        pull: missing
        log_driver: "{{ app_log_driver }}"
        log_options: "{{ app_log_options }}"
        healthcheck: "{{ app_container_healthcheck }}"
        ports:
          - "{{ app_bind_address }}:{{ app_public_port }}:8080"
          - "{{ app_management_bind_address }}:{{ app_management_port }}:{{ app_container_management_port }}"
        volumes:
          - "{{ app_uploads_dir }}:{{ app_container_uploads_dir }}"
          - "{{ app_log_dir }}:{{ app_container_log_dir }}"
        env: "{{ app_common_environment | combine(app_external_services_environment) }}"
      no_log: true

    - name: Verify application candidate
      ansible.builtin.include_tasks: verify_container.yml

    - name: Record application ready time
      ansible.builtin.command: date +%s
      register: app_ready_at
      changed_when: false

    - name: Report application restart window
      ansible.builtin.debug:
        msg: >-
          Application restart window:
          {{ app_ready_at.stdout | int - app_restart_started_at.stdout | int }} seconds.
          Previous runtime retained as {{ app_previous_container_name
          if app_previous_preserved else 'none (initial deployment)' }}.

  rescue:
    - name: Remove unsuccessful application candidate
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        state: absent
        force_kill: true
      when: app_previous_preserved | bool or not app_active_container.exists

    - name: Restore complete previous application runtime
      ansible.builtin.include_tasks: restore_previous.yml
      when: app_previous_preserved | bool

    - name: Restart active runtime when preservation failed
      ansible.builtin.command: "docker start {{ app_container_name }}"
      changed_when: true
      when:
        - app_active_stopped | bool
        - not app_previous_preserved | bool

    - name: Fail deployment after transactional recovery
      ansible.builtin.fail:
        msg: >-
          Deployment of {{ app_image }} failed.
          {{ 'The complete previous runtime was restored.'
             if app_previous_preserved
             else 'No previous runtime was available for rollback.' }}

- name: Verify unchanged application runtime
  ansible.builtin.include_tasks: verify_container.yml
  when:
    - not ansible_check_mode
    - not app_candidate_plan.changed
