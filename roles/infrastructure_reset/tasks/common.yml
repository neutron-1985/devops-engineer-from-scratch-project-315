---
- name: Remove Docker, Nginx, and UFW packages
  ansible.builtin.apt:
    name: "{{ infrastructure_reset_docker_packages + infrastructure_reset_nginx_packages + ['ufw'] }}"
    state: absent
    purge: true
    autoremove: true

- name: Remove Docker repository, configuration, and runtime data
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ infrastructure_reset_docker_paths }}"

- name: Remove Nginx cache
  ansible.builtin.file:
    path: "{{ infrastructure_reset_nginx_cache_dir }}"
    state: absent

- name: Remove UFW configuration
  ansible.builtin.file:
    path: /etc/ufw
    state: absent

- name: Remove Docker group
  ansible.builtin.group:
    name: docker
    state: absent
