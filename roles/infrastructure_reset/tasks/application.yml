---
- name: Remove application container
  community.docker.docker_container:
    name: "{{ infrastructure_reset_app_container_name }}"
    state: absent
    force_kill: true
  when: infrastructure_reset_docker_info.rc == 0

- name: Remove application data and logs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ infrastructure_reset_app_data_dir }}"
    - "{{ infrastructure_reset_app_log_dir }}"

- name: Remove deployment users and their home directories
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: absent
    remove: true
    force: true
  loop: "{{ server_provision_users | default([{'name': deploy_user}]) }}"
