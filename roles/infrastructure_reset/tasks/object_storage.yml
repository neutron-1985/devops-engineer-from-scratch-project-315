---
- name: Remove object storage migration containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  loop: "{{ infrastructure_reset_object_storage_migration_container_names }}"
  when: infrastructure_reset_docker_info.rc == 0

- name: Remove MinIO containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  loop: "{{ infrastructure_reset_minio_container_names }}"
  when: infrastructure_reset_docker_info.rc == 0

- name: Remove legacy MinIO data volume
  community.docker.docker_volume:
    name: "{{ infrastructure_reset_legacy_minio_volume_name }}"
    state: absent
  when: infrastructure_reset_docker_info.rc == 0

- name: Remove MinIO data and configuration
  ansible.builtin.file:
    path: "{{ infrastructure_reset_minio_root_dir }}"
    state: absent

- name: Remove RustFS containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  loop: "{{ infrastructure_reset_rustfs_container_names }}"
  when: infrastructure_reset_docker_info.rc == 0

- name: Remove legacy RustFS volumes
  community.docker.docker_volume:
    name: "{{ item }}"
    state: absent
  loop: "{{ infrastructure_reset_legacy_rustfs_volume_names }}"
  when: infrastructure_reset_docker_info.rc == 0

- name: Remove RustFS data and configuration
  ansible.builtin.file:
    path: "{{ infrastructure_reset_rustfs_root_dir }}"
    state: absent

- name: Remove object storage firewall local facts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ infrastructure_reset_object_storage_firewall_fact_files }}"
