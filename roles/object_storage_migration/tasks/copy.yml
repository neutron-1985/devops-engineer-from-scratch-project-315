---
- name: Mirror object storage data to the target provider
  community.docker.docker_container:
    name: "{{ object_storage_migration_container_name }}"
    image: "{{ object_storage_migration_client_image }}"
    state: started
    detach: false
    cleanup: true
    pull: missing
    network_mode: host
    command:
      - mirror
      - --overwrite
      - --retry
      - "source/{{ object_storage_migration_bucket }}"
      - "target/{{ object_storage_migration_bucket }}"
    env:
      MC_HOST_source: >-
        {{ 'http://' ~ object_storage_migration_access_key ~ ':' ~
           object_storage_migration_secret_key ~ '@' ~
           object_storage_migration_source_address }}
      MC_HOST_target: >-
        {{ 'http://' ~ object_storage_migration_access_key ~ ':' ~
           object_storage_migration_secret_key ~ '@' ~
           object_storage_migration_target_address }}
  no_log: true
  when: not ansible_check_mode

