---
# Shared runtime contract. Environment inventories contain identity values only.
environment_hyphen_suffix: "{{ '' if environment_name == 'prod' else '-' ~ environment_name }}"

ansible_local_facts_dir: /etc/ansible/facts.d

# Application runtime.
app_container_name: "project-devops-deploy{{ environment_hyphen_suffix }}"
app_data_dir: "/var/lib/project-devops-deploy{{ environment_hyphen_suffix }}"
app_uploads_dir: "{{ app_data_dir }}/bulletin-images"
app_log_dir: "/var/log/project-devops-deploy{{ environment_hyphen_suffix }}"
app_profile: prod
app_storage_backend: s3

# Environment database.
database_host: "{{ hostvars[groups['database'] | first].ansible_host }}"
database_name: bulletins
database_username: bulletins_app
database_password: "{{ vault_database_passwords[environment_name] }}"
database_application_allowed_cidrs:
  - "{{ hostvars[groups['application'] | first].ansible_host }}/32"
database_url: >-
  jdbc:postgresql://{{ database_host }}:{{ database_port }}/{{ database_name }}
database_migration_container_name: >-
  project-devops-deploy{{ environment_hyphen_suffix }}-migration
postgresql_container_name: "project-devops-postgresql{{ environment_hyphen_suffix }}"
postgresql_root_dir: "/var/lib/project-devops-postgresql{{ environment_hyphen_suffix }}"
postgresql_data_dir: "{{ postgresql_root_dir }}/data"
postgresql_log_dir: "/var/log/project-devops-postgresql{{ environment_hyphen_suffix }}"
postgresql_fact_file: >-
  {{ ansible_local_facts_dir }}/postgresql_firewall{{ environment_hyphen_suffix }}.fact

# Shared Nginx gateway.
nginx_http_port: "80"
nginx_https_port: "443"
nginx_listen_port: "{{ nginx_http_port }}"
nginx_container_name: project-devops-nginx
nginx_container_uid: "101"
nginx_container_gid: "101"
nginx_config_dir: /etc/nginx/conf.d
nginx_bootstrap_config_path: "{{ nginx_config_dir }}/00-project-bootstrap.conf"
nginx_routes_config_pattern: 20-project-*.conf
nginx_cache_root_dir: /var/cache/nginx
nginx_static_cache_path: "{{ nginx_cache_root_dir }}/{{ environment_name }}/static"
nginx_static_cache_max_size: 256m
nginx_uploads_cache_path: "{{ nginx_cache_root_dir }}/{{ environment_name }}/uploads"
nginx_uploads_cache_max_size: 1g

# Shared TLS and Certbot configuration.
# Existing Certbot lineage for the shared multi-domain certificate.
tls_gateway_certificate_name: dev.n-devops.jumpingcrab.com
tls_certificate_admin_email: neutron-1985@live.ru
acme_challenge_webroot: /var/www/letsencrypt
certbot_image: certbot/certbot:v5.6.0
certbot_container_name: project-devops-certbot
certbot_config_dir: /etc/letsencrypt
certbot_work_dir: /var/lib/letsencrypt
certbot_log_dir: /var/log/project-devops-certbot
certbot_renewal_service_unit: project-devops-certbot-renew.service
certbot_renewal_timer_unit: project-devops-certbot-renew.timer

# Environment S3 resources and shared service administration.
object_storage_provider: rustfs
object_storage_client_image: minio/mc:RELEASE.2025-08-13T08-35-41Z
object_storage_inventory_host: "{{ groups['object_storage'] | first }}"
object_storage_endpoint: >-
  http://{{ hostvars[object_storage_inventory_host].ansible_host }}:{{ object_storage_api_port }}
object_storage_bucket_base: bulletin-images
object_storage_bucket: "{{ object_storage_bucket_base }}{{ environment_hyphen_suffix }}"
object_storage_region: us-east-1
object_storage_object_prefix: bulletins
object_storage_policy_name: "bulletins{{ environment_hyphen_suffix }}-app-read-write"
object_storage_access_key: "bulletins{{ environment_hyphen_suffix }}-app"
object_storage_secret_key: >-
  {{ vault_object_storage_application_secret_keys[environment_name] }}
object_storage_admin_access_key: bulletins-storage-admin
object_storage_admin_secret_key: "{{ vault_object_storage_admin_secret_key }}"
object_storage_public_api_allowed_cidrs:
  - 0.0.0.0/0
object_storage_application_api_allowed_cidrs:
  - "{{ hostvars[groups['application'] | first].ansible_host }}/32"
object_storage_migration_container_name: >-
  project-devops-object-storage{{ environment_hyphen_suffix }}-migration
object_storage_provider_switch_migration_port: >-
  {{ (object_storage_api_port | int) + 100 }}
object_storage_fact_file: >-
  {{ ansible_local_facts_dir }}/object_storage_firewall{{ environment_hyphen_suffix }}.fact
minio_container_name: "project-devops-minio{{ environment_hyphen_suffix }}"
minio_root_dir: "/var/lib/project-devops-minio{{ environment_hyphen_suffix }}"
minio_log_dir: "/var/log/project-devops-minio{{ environment_hyphen_suffix }}"
rustfs_container_name: "project-devops-rustfs{{ environment_hyphen_suffix }}"
rustfs_root_dir: "/var/lib/project-devops-rustfs{{ environment_hyphen_suffix }}"
rustfs_log_dir: "/var/log/project-devops-rustfs{{ environment_hyphen_suffix }}"
