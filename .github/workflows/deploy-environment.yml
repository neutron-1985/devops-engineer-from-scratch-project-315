name: Deploy environment

on:
  workflow_call:
    inputs:
      target_environment:
        description: Environment to reconcile and deploy
        required: true
        type: string
      image_tag:
        description: Immutable image tag selected by the release plan
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Reconcile and deploy ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment }}
    concurrency:
      group: deploy-${{ inputs.target_environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.target_environment }}
      APP_IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Ansible
        run: python -m pip install ansible

      - name: Install Ansible dependencies
        run: make ansible-install

      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_VAULT_PASSWORD"
          install -m 600 /dev/null .vault-password
          printf "%s\n" "$ANSIBLE_VAULT_PASSWORD" > .vault-password

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Reconcile infrastructure
        run: make infra-apply ENVIRONMENT="$ENVIRONMENT"

      - name: Check deployment
        run: >-
          make ansible-check
          ENVIRONMENT="$ENVIRONMENT"
          APP_IMAGE_TAG="$APP_IMAGE_TAG"

      - name: Deploy selected image
        run: >-
          make deploy
          ENVIRONMENT="$ENVIRONMENT"
          APP_IMAGE_TAG="$APP_IMAGE_TAG"

      - name: Record release summary
        if: success()
        run: |
          {
            echo "## Environment reconciled and deployed"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | $ENVIRONMENT |"
            echo "| Image tag | $APP_IMAGE_TAG |"
            echo "| Configuration commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"
