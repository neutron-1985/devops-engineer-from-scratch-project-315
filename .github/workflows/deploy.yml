name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag, for example sha-425dd32
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate Docker image tag
        shell: bash
        run: |
          if [[ ! "$APP_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $APP_IMAGE_TAG" >&2
            exit 1
          fi

      - name: Install Ansible
        run: python -m pip install ansible

      - name: Install Ansible dependencies
        run: make ansible-install

      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_VAULT_PASSWORD"
          install -m 600 /dev/null .vault-password
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > .vault-password

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Check deployment
        run: make ansible-check APP_IMAGE_TAG="$APP_IMAGE_TAG"

      - name: Deploy Docker image
        run: make deploy APP_IMAGE_TAG="$APP_IMAGE_TAG"
