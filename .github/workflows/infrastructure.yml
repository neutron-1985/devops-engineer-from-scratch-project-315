name: Infrastructure

run-name: "${{ inputs.operation }} infrastructure"

on:
  workflow_call:
    inputs:
      operation:
        description: Preview or reconcile infrastructure
        required: true
        type: string
      target_environment:
        description: Environment resources to preview or reconcile
        required: false
        default: dev
        type: string
      all_environments:
        description: Reconcile dev, stage, and prod resources
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      operation:
        description: Preview or reconcile infrastructure
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      target_environment:
        description: Environment resources to preview or reconcile
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  contents: read

concurrency:
  group: shared-infrastructure
  cancel-in-progress: false

jobs:
  preview:
    name: Preview infrastructure
    if: inputs.operation == 'preview'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.target_environment }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Ansible
        run: python -m pip install ansible

      - name: Install Ansible dependencies
        run: make ansible-install

      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_VAULT_PASSWORD"
          install -m 600 /dev/null .vault-password
          printf "%s\n" "$ANSIBLE_VAULT_PASSWORD" > .vault-password

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Preview infrastructure changes
        run: make infra-preview ENVIRONMENT="$ENVIRONMENT"

  apply:
    name: Apply infrastructure
    if: inputs.operation == 'apply'
    runs-on: ubuntu-latest
    environment: infrastructure
    env:
      ENVIRONMENT: ${{ inputs.target_environment }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Ansible
        run: python -m pip install ansible

      - name: Install Ansible dependencies
        run: make ansible-install

      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_VAULT_PASSWORD"
          install -m 600 /dev/null .vault-password
          printf "%s\n" "$ANSIBLE_VAULT_PASSWORD" > .vault-password

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Reconcile all environments
        if: inputs.all_environments
        run: make infra-apply-all ENVIRONMENT=prod

      - name: Reconcile selected environment
        if: ${{ !inputs.all_environments }}
        run: make infra-apply ENVIRONMENT="$ENVIRONMENT"

      - name: Record infrastructure summary
        run: |
          {
            echo "## Infrastructure reconciled"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Scope | ${{ inputs.all_environments && 'dev, stage, prod' || inputs.target_environment }} |"
            echo "| Infrastructure commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"
