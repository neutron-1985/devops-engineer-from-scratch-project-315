name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
    && format('Release {0} from inventory', inputs.target_environment)
    || github.event.head_commit.message
  }}

on:
  push:
    branches:
      - main
    paths:
      - environments/dev/inventory/group_vars/all/vars.yml
      - environments/stage/inventory/group_vars/all/vars.yml
      - environments/prod/inventory/group_vars/all/vars.yml
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to reconcile and deploy from its inventory
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      environments: >-
        ${{ github.event_name == 'workflow_dispatch'
            && format('["{0}"]', inputs.target_environment)
            || steps.changes.outputs.changes }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed environment inventory
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            dev:
              - environments/dev/inventory/group_vars/all/vars.yml
            stage:
              - environments/stage/inventory/group_vars/all/vars.yml
            prod:
              - environments/prod/inventory/group_vars/all/vars.yml


  deploy:
    name: Reconcile and deploy ${{ matrix.environment }}
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.detect.outputs.environments) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Ansible
        run: python -m pip install ansible

      - name: Install Ansible dependencies
        run: make ansible-install

      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_VAULT_PASSWORD"
          install -m 600 /dev/null .vault-password
          printf "%s\n" "$ANSIBLE_VAULT_PASSWORD" > .vault-password

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Reconcile infrastructure
        run: make infra-apply ENVIRONMENT="$ENVIRONMENT"

      - name: Check deployment
        run: make ansible-check ENVIRONMENT="$ENVIRONMENT"

      - name: Deploy inventory image
        run: make deploy ENVIRONMENT="$ENVIRONMENT"

      - name: Record release summary
        if: success()
        run: |
          {
            echo "## Environment reconciled and deployed"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | $ENVIRONMENT |"
            echo "| Configuration commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"
