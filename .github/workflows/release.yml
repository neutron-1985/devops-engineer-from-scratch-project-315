name: Release

run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    paths:
      - environments/dev/inventory/group_vars/all/vars.yml
      - environments/stage/inventory/group_vars/all/vars.yml
      - environments/prod/inventory/group_vars/all/vars.yml
      - environments/_shared/**
      - playbooks/**
      - roles/**
      - ansible.cfg
      - Makefile
      - playbook.yml
      - requirements.yml
      - .github/workflows/deploy-environment.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select deployment plan
    runs-on: ubuntu-latest
    outputs:
      source_environment: >-
        ${{ steps.changes.outputs.dev == 'true' && 'dev'
            || steps.changes.outputs.stage == 'true' && 'stage'
            || steps.changes.outputs.prod == 'true' && 'prod'
            || 'configuration' }}
      configuration_changed: ${{ steps.changes.outputs.configuration }}
      promotion_image_tag: >-
        ${{ steps.changes.outputs.dev == 'true' && steps.dev_image.outputs.image_tag
            || steps.changes.outputs.stage == 'true' && steps.stage_image.outputs.image_tag
            || steps.prod_image.outputs.image_tag }}
      dev_image_tag: ${{ steps.dev_image.outputs.image_tag }}
      stage_image_tag: ${{ steps.stage_image.outputs.image_tag }}
      prod_image_tag: ${{ steps.prod_image.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed environment inventories
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            dev:
              - environments/dev/inventory/group_vars/all/vars.yml
            stage:
              - environments/stage/inventory/group_vars/all/vars.yml
            prod:
              - environments/prod/inventory/group_vars/all/vars.yml
            configuration:
              - environments/_shared/**
              - playbooks/**
              - roles/**
              - ansible.cfg
              - Makefile
              - playbook.yml
              - requirements.yml
              - .github/workflows/deploy-environment.yml
              - .github/workflows/release.yml

      - name: Read dev image tag
        id: dev_image
        run: >-
          printf 'image_tag=%s\n' "$(awk
          '$1 == "app_image_tag:" { print $2 }'
          environments/dev/inventory/group_vars/all/vars.yml)"
          >> "$GITHUB_OUTPUT"

      - name: Read stage image tag
        id: stage_image
        run: >-
          printf 'image_tag=%s\n' "$(awk
          '$1 == "app_image_tag:" { print $2 }'
          environments/stage/inventory/group_vars/all/vars.yml)"
          >> "$GITHUB_OUTPUT"

      - name: Read prod image tag
        id: prod_image
        run: >-
          printf 'image_tag=%s\n' "$(awk
          '$1 == "app_image_tag:" { print $2 }'
          environments/prod/inventory/group_vars/all/vars.yml)"
          >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy dev
    needs: plan
    if: >-
      ${{ needs.plan.outputs.source_environment == 'dev'
          || needs.plan.outputs.configuration_changed == 'true' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target_environment: dev
      image_tag: >-
        ${{ needs.plan.outputs.source_environment == 'dev'
            && needs.plan.outputs.promotion_image_tag
            || needs.plan.outputs.dev_image_tag }}
    secrets: inherit

  deploy-stage:
    name: Deploy stage
    needs:
      - plan
      - deploy-dev
    if: >-
      ${{ always()
      && needs.plan.result == 'success'
      && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
      && (needs.plan.outputs.configuration_changed == 'true'
          || needs.plan.outputs.source_environment == 'dev'
          || needs.plan.outputs.source_environment == 'stage') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target_environment: stage
      image_tag: >-
        ${{ (needs.plan.outputs.source_environment == 'dev'
             || needs.plan.outputs.source_environment == 'stage')
            && needs.plan.outputs.promotion_image_tag
            || needs.plan.outputs.stage_image_tag }}
    secrets: inherit

  deploy-prod:
    name: Deploy prod
    needs:
      - plan
      - deploy-stage
    if: >-
      ${{ always()
      && needs.plan.result == 'success'
      && (needs.deploy-stage.result == 'success' || needs.deploy-stage.result == 'skipped') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target_environment: prod
      image_tag: >-
        ${{ needs.plan.outputs.source_environment != 'configuration'
            && needs.plan.outputs.promotion_image_tag
            || needs.plan.outputs.prod_image_tag }}
    secrets: inherit
