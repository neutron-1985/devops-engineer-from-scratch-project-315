name: Release

run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    paths:
      - environments/dev/inventory/group_vars/all/vars.yml
      - environments/stage/inventory/group_vars/all/vars.yml
      - environments/prod/inventory/group_vars/all/vars.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select release source
    runs-on: ubuntu-latest
    outputs:
      source_environment: >-
        ${{ steps.changes.outputs.dev == 'true' && 'dev'
            || steps.changes.outputs.stage == 'true' && 'stage'
            || 'prod' }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed environment inventories
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            dev:
              - environments/dev/inventory/group_vars/all/vars.yml
            stage:
              - environments/stage/inventory/group_vars/all/vars.yml
            prod:
              - environments/prod/inventory/group_vars/all/vars.yml

      - name: Read image tag from prioritized inventory
        id: image
        env:
          SOURCE_ENVIRONMENT: >-
            ${{ steps.changes.outputs.dev == 'true' && 'dev'
                || steps.changes.outputs.stage == 'true' && 'stage'
                || 'prod' }}
        run: >-
          printf 'image_tag=%s\n' "$(awk
          '$1 == "app_image_tag:" { print $2 }'
          "environments/${SOURCE_ENVIRONMENT}/inventory/group_vars/all/vars.yml")"
          >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy dev
    needs: plan
    if: needs.plan.outputs.source_environment == 'dev'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target_environment: dev
      image_tag: ${{ needs.plan.outputs.image_tag }}
    secrets: inherit

  deploy-stage:
    name: Deploy stage
    needs:
      - plan
      - deploy-dev
    if: >-
      ${{ always()
      && needs.plan.result == 'success'
      && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
      && (needs.plan.outputs.source_environment == 'dev'
          || needs.plan.outputs.source_environment == 'stage') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target_environment: stage
      image_tag: ${{ needs.plan.outputs.image_tag }}
    secrets: inherit

  deploy-prod:
    name: Deploy prod
    needs:
      - plan
      - deploy-stage
    if: >-
      ${{ always()
      && needs.plan.result == 'success'
      && (needs.deploy-stage.result == 'success' || needs.deploy-stage.result == 'skipped') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target_environment: prod
      image_tag: ${{ needs.plan.outputs.image_tag }}
    secrets: inherit
