---
- name: Render environment host inventories
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    runtime_inventory_environments:
      - dev
      - stage
      - prod

  tasks:
    - name: Render environment host inventory
      ansible.builtin.template:
        src: templates/environment_hosts.yml.j2
        dest: "{{ playbook_dir }}/../environments/{{ item }}/inventory/hosts.yml"
        mode: "0600"
      loop: "{{ runtime_inventory_environments }}"
      loop_control:
        label: "{{ item }}"
      vars:
        rendered_environment: "{{ item }}"
