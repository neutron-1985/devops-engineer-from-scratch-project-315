---
- name: Roll back application runtime
  hosts: application
  serial: 1
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false
  any_errors_fatal: true
  tags:
    - rollback
    - application

  tasks:
    - name: Restore previous application release
      ansible.builtin.import_role:
        name: application/service
        tasks_from: rollback
