---
- name: Verify environment database and object storage through the application
  hosts: application
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - deploy
    - smoke

  roles:
    - role: database/application_smoke_test
    - role: object_storage/smoke_test

- name: Verify environment Nginx caches
  hosts: application
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - deploy
    - smoke
    - cache-smoke

  roles:
    - role: nginx/cache_smoke_test

- name: Verify environment HTTPS and certificate renewal
  hosts: application
  remote_user: "{{ ssh_inventory.provision_user }}"
  become: true
  gather_facts: false
  tags: tls-smoke

  roles:
    - role: tls/smoke_test
