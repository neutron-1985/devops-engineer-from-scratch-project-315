---
- name: Reconcile common infrastructure host prerequisites
  hosts: infrastructure
  remote_user: "{{ ssh_inventory.provision_user }}"
  become: true
  tags: infrastructure

  roles:
    - role: common/host_prerequisites
    - role: geerlingguy.docker
    - role: common/deployment_access
    - role: common/firewall_policy

- name: Reconcile shared application gateway prerequisites
  hosts: application
  remote_user: "{{ ssh_inventory.provision_user }}"
  become: true
  gather_facts: false
  tags:
    - infrastructure
    - application

  roles:
    - role: nginx/install
