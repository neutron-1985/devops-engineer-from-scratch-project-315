---
- name: "Step 4 | Put Nginx in front of the application"
  hosts: application
  remote_user: "{{ ssh_inventory.provision_user }}"
  become: true
  tags:
    - step_04
    - gateway
    - nginx

  pre_tasks:
    - name: Load environment route catalog
      ansible.builtin.import_role:
        name: nginx/environment_routes
      when: "'environment' not in ansible_run_tags"
      tags: always

  roles:
    - role: nginx/install
      tags: nginx-install
    - role: nginx/reverse_proxy
      tags: nginx-proxy
    - role: nginx/cache
      tags: nginx-cache
    - role: common/firewall_policy
      tags: nginx-proxy
      firewall_policy_allowed_tcp_ports:
        - "{{ nginx_http_port }}"
      firewall_policy_revoked_tcp_ports: >-
        {{ nginx_environment_application_ports
           + nginx_environment_management_ports }}

- name: "Step 4 | Verify application storage and Nginx caches"
  hosts: application
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - step_04
    - nginx

    - environment
  vars:
    nginx_cache_smoke_base_url: "http://{{ nginx_server_name }}"
    object_storage_smoke_public_base_url: "http://{{ nginx_server_name }}"

  roles:
    - role: object_storage/smoke_test
    - role: nginx/cache_smoke_test
      tags: cache-smoke
