---
- name: "Step 4 | Provision object storage hosts"
  hosts: object_storage
  remote_user: "{{ vault_inventory.provision_user }}"
  become: true
  tags:
    - step_04
    - storage

  roles:
    - role: geerlingguy.docker
    - role: deployment_access
    - role: firewall_policy
    - role: object_storage_host

  tasks:
    - name: Prepare selected object storage provider configuration
      ansible.builtin.import_role:
        name: object_storage_deploy
        tasks_from: prepare

- name: "Step 4 | Deploy S3-compatible object storage service"
  hosts: object_storage
  remote_user: "{{ vault_inventory.deploy_user }}"
  become: false
  tags:
    - step_04
    - storage

  roles:
    - role: object_storage_provider_switch

- name: "Step 4 | Switch production application to S3"
  hosts: production
  remote_user: "{{ vault_inventory.deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - step_04
    - storage

  vars:
    app_profile: prod
    app_storage_backend: s3
    app_bind_address: 0.0.0.0

  roles:
    - role: app_deploy
    - role: object_storage_smoke_test

  post_tasks:
    - name: Complete the application S3 transition
      ansible.builtin.import_role:
        name: object_storage_provider_switch
        tasks_from: complete
