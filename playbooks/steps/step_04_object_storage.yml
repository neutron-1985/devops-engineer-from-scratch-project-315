---
- name: "Step 4 | Provision object storage hosts"
  hosts: object_storage
  remote_user: "{{ vault_inventory.provision_user }}"
  become: true
  tags:
    - step_04
    - storage

  roles:
    - role: geerlingguy.docker
    - role: deployment_access
    - role: firewall_policy

  tasks:
    - name: Prepare object storage firewall and application policy
      ansible.builtin.import_role:
        name: object_storage_service
      vars:
        object_storage_service_scope: host

- name: "Step 4 | Deploy S3-compatible object storage service"
  hosts: object_storage
  remote_user: "{{ vault_inventory.deploy_user }}"
  become: false
  tags:
    - step_04
    - storage

  tasks:
    - name: Deploy and configure object storage service
      ansible.builtin.import_role:
        name: object_storage_service
      vars:
        object_storage_service_scope: service

- name: "Step 4 | Switch production application to S3"
  hosts: production
  remote_user: "{{ vault_inventory.deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - step_04
    - storage

  vars:
    app_profile: prod
    app_storage_backend: s3
    app_bind_address: 0.0.0.0
    # Nginx is introduced only in step 5, so links use the S3 endpoint here.
    app_s3_cdn_url: ""

  roles:
    - role: app_deploy
    - role: storage_smoke_test
      storage_smoke_app_url: "http://127.0.0.1:{{ app_public_port }}"

  post_tasks:
    - name: Complete the application S3 transition
      ansible.builtin.import_role:
        name: object_storage_service
        tasks_from: application_transition/complete
