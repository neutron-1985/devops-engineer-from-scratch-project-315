---
- name: "Step 3 | Provision database hosts"
  hosts: database
  remote_user: "{{ vault_inventory.provision_user }}"
  become: true
  tags:
    - step_03
    - database

  roles:
    - role: geerlingguy.docker
    - role: deployment_access
    - role: firewall_policy

  tasks:
    - name: Configure PostgreSQL host as provisioning user
      ansible.builtin.import_role:
        name: database_service
        tasks_from: admin

- name: "Step 3 | Run PostgreSQL container"
  hosts: database
  remote_user: "{{ vault_inventory.deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - step_03
    - database

  tasks:
    - name: Manage PostgreSQL container as deployment user
      ansible.builtin.import_role:
        name: database_service
        tasks_from: containers

- name: "Step 3 | Migrate database and switch application to production"
  hosts: production
  remote_user: "{{ vault_inventory.deploy_user }}"
  become: false
  gather_facts: false
  any_errors_fatal: true
  tags:
    - step_03
    - database

  vars:
    app_profile: prod
    app_storage_backend: local
    app_bind_address: 0.0.0.0

  roles:
    - role: database_migrations
    - role: app_deploy
