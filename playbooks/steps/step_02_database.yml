---
- name: "Step 2 | Provision database hosts"
  hosts: database
  remote_user: "{{ ssh_inventory.provision_user }}"
  become: true
  tags:
    - step_02
    - database

  roles:
    - role: geerlingguy.docker
    - role: deployment_access
    - role: firewall_policy
    - role: db_host
    - role: db_firewall

- name: "Step 2 | Run PostgreSQL container"
  hosts: database
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - step_02
    - database

  roles:
    - role: db_service
    - role: db_service_smoke_test

- name: "Step 2 | Migrate database and switch application to production"
  hosts: application
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false
  any_errors_fatal: true
  tags:
    - step_02
    - database

  vars:
    app_profile: prod
    app_storage_backend: local
    app_bind_address: 0.0.0.0

  roles:
    - role: db_migration
    - role: app_service
    - role: db_application_smoke_test
