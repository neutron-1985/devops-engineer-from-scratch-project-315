---
- name: "Step 2 | Prepare application host"
  hosts: application
  remote_user: "{{ vault_inventory.provision_user }}"
  become: true
  tags: step_02

  tasks:
    - name: Prepare application directories as provisioning user
      ansible.builtin.import_role:
        name: app_deploy
        tasks_from: directories

- name: "Step 2 | Deploy standalone application"
  hosts: application
  remote_user: "{{ vault_inventory.deploy_user }}"
  become: false
  gather_facts: false
  tags: step_02

  vars:
    app_profile: dev
    app_storage_backend: local
    app_bind_address: 0.0.0.0

  roles:
    - role: app_deploy
