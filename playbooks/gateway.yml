---
- name: Publish requested environment routes through the shared gateway
  hosts: application
  remote_user: "{{ ssh_inventory.provision_user }}"
  become: true
  gather_facts: false
  tags: gateway

  pre_tasks:
    - name: Load requested public environment routes
      ansible.builtin.import_role:
        name: nginx/environment_routes

    - name: Prepare cache directories for requested environment routes
      ansible.builtin.import_role:
        name: nginx/cache
        tasks_from: directories

    - name: Reconcile shared gateway firewall
      ansible.builtin.import_role:
        name: common/firewall_policy
      vars:
        firewall_policy_allowed_tcp_ports:
          - "{{ nginx_http_port }}"
          - "{{ nginx_https_port }}"
        firewall_policy_revoked_tcp_ports: >-
          {{ nginx_environment_application_ports
             + nginx_environment_management_ports }}

    - name: Check whether the shared certificate exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ tls_certificate_name }}/fullchain.pem"
      register: gateway_certificate

    - name: Publish routes with the current certificate before SAN expansion
      ansible.builtin.import_role:
        name: tls/nginx
      when: gateway_certificate.stat.exists

  roles:
    - role: tls/certificate
    - role: tls/certificate_renewal

  post_tasks:
    - name: Publish final HTTPS configuration
      ansible.builtin.import_role:
        name: tls/nginx

    - name: Reload Nginx container after certificate changes
      community.docker.docker_container_exec:
        container: "{{ nginx_container_name }}"
        command: nginx -s reload
      when: not ansible_check_mode

