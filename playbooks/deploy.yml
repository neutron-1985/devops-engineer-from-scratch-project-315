---
- name: Migrate production-like runtime databases
  hosts: application
  serial: 1
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false
  any_errors_fatal: true
  tags: deploy

  roles:
    - role: db_migration
      when: app_profile == 'prod'

- name: Deploy application runtime
  hosts: application
  serial: 1
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false
  any_errors_fatal: true
  tags: deploy

  vars:
    app_require_immutable_image_tag: true

  roles:
    - role: app_service

- name: Verify production-like runtime deployment
  hosts: application
  serial: 1
  remote_user: "{{ ssh_inventory.deploy_user }}"
  become: false
  gather_facts: false

  roles:
    - role: db_application_smoke_test
      when: app_profile == 'prod'
    - role: storage_smoke_test
      object_storage_smoke_public_base_url: "https://{{ nginx_server_name }}"
      when: app_storage_backend == 's3'
    - role: nginx/cache_smoke_test
      when: app_storage_backend == 's3'
