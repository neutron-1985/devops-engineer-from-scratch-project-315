- name: Provision infrastructure hosts
  hosts: infrastructure
  remote_user: "{{ provision_user }}"
  become: true
  tags:
    - provision

  roles:
    - role: server_provision
    - role: nginx_reverse_proxy
      when:
        - "'application' in group_names"
        - not nginx_https_enabled | default(false) | bool
    - role: nginx_https
      when:
        - "'application' in group_names"
        - nginx_https_enabled | default(false) | bool

- name: Migrate production database
  hosts: production
  remote_user: "{{ deploy_user }}"
  become: false
  gather_facts: false
  any_errors_fatal: true
  tags:
    - deploy

  roles:
    - role: database_migrations

- name: Deploy application
  hosts: application
  remote_user: "{{ deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - deploy

  roles:
    - role: app_deploy

- name: Verify production object storage through the application
  hosts: production
  remote_user: "{{ deploy_user }}"
  become: false
  gather_facts: false
  tags:
    - deploy
    - smoke

  roles:
    - role: storage_smoke_test

- name: Verify production HTTPS and certificate renewal
  hosts: production
  remote_user: "{{ provision_user }}"
  become: true
  gather_facts: false
  tags:
    - tls-smoke

  roles:
    - role: tls_smoke_test

- name: Provision PostgreSQL database
  hosts: database
  remote_user: "{{ provision_user }}"
  become: true
  tags:
    - database

  roles:
    - role: database

- name: Provision object storage
  hosts: object_storage
  remote_user: "{{ provision_user }}"
  become: true
  tags:
    - storage

  roles:
    - role: object_storage

- name: Reset infrastructure hosts
  hosts: infrastructure
  remote_user: "{{ provision_user }}"
  become: true
  tags:
    - reset

  roles:
    - role: infrastructure_reset
