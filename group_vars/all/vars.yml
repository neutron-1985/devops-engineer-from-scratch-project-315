---
# Inventory identity shared by every infrastructure role.
vault_inventory: "{{ project_vault.inventory }}"

# Application network contract shared by app_deploy, firewall, and Nginx.
app_public_port: "8080"
app_container_management_port: "9090"

# Database connection shared by database_service, database_migrations, and app_deploy.
database_host: "{{ hostvars[groups['database'] | first].ansible_host }}"
database_port: "5432"
database_name: bulletins
database_username: bulletins_app
database_password: "{{ project_vault.database.postgresql_password }}"
database_url: >-
  jdbc:postgresql://{{ database_host }}:{{ database_port }}/{{ database_name }}

# S3 contract shared by object storage roles, app_deploy, and storage_smoke_test.
object_storage_api_port: "9000"
object_storage_endpoint: >-
  http://{{ hostvars[groups['object_storage'] | first].ansible_host }}:{{ object_storage_api_port }}
object_storage_bucket: bulletin-images
object_storage_region: us-east-1
object_storage_object_prefix: bulletins
object_storage_policy_name: bulletins-app-read-write
object_storage_access_key: bulletins-app
object_storage_secret_key: "{{ project_vault.object_storage.application_secret_key }}"
object_storage_admin_access_key: bulletins-storage-admin
object_storage_admin_secret_key: "{{ project_vault.object_storage.admin_secret_key }}"

# Reverse-proxy contract shared by the HTTP and HTTPS Nginx roles.
nginx_server_name: n-devops.jumpingcrab.com
nginx_app_upstream: "http://127.0.0.1:{{ app_public_port }}"
nginx_uploads_enabled: true
nginx_uploads_upstream: "{{ object_storage_endpoint }}"
nginx_uploads_bucket: "{{ object_storage_bucket }}"
nginx_client_max_body_size: 20m
nginx_static_cache_path: /var/cache/nginx/project-static
nginx_static_cache_max_size: 256m
nginx_uploads_cache_path: /var/cache/nginx/project-uploads
nginx_uploads_cache_max_size: 1g
