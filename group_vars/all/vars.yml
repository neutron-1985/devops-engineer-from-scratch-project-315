---
# Inventory identity and filesystem contracts shared by infrastructure roles.
vault_inventory: "{{ project_vault.inventory }}"
ansible_local_facts_dir: /etc/ansible/facts.d

# Application contract shared by application roles, provider switching, reset, firewall, and Nginx.
app_container_name: project-devops-deploy
app_data_dir: /var/lib/project-devops-deploy
app_uploads_dir: "{{ app_data_dir }}/bulletin-images"
app_public_port: "8080"
app_container_management_port: "9090"

# Database contract shared by database roles, application/service, and common/infrastructure_reset.
database_host: "{{ hostvars[groups['database'] | first].ansible_host }}"
database_port: "5432"
database_name: bulletins
database_username: bulletins_app
database_password: "{{ project_vault.database.postgresql_password }}"
database_url: >-
  jdbc:postgresql://{{ database_host }}:{{ database_port }}/{{ database_name }}
postgresql_container_name: project-devops-postgresql
postgresql_root_dir: /var/lib/project-devops-postgresql
postgresql_data_dir: "{{ postgresql_root_dir }}/data"
postgresql_fact_file: "{{ ansible_local_facts_dir }}/postgresql_firewall.fact"

# Reverse-proxy contract shared by the HTTP and HTTPS Nginx roles.
nginx_http_port: "80"
nginx_https_port: "443"
nginx_listen_port: "{{ nginx_http_port }}"
nginx_main_config_path: /etc/nginx/nginx.conf
nginx_server_name: n-devops.jumpingcrab.com
tls_certificate_admin_email: neutron-1985@live.ru
acme_challenge_webroot: /var/www/letsencrypt
nginx_app_upstream: "http://127.0.0.1:{{ app_public_port }}"
nginx_uploads_upstream: "{{ object_storage_endpoint }}"
nginx_uploads_bucket: "{{ object_storage_bucket }}"
nginx_cache_root_dir: /var/cache/nginx
nginx_static_cache_path: "{{ nginx_cache_root_dir }}/project-static"
nginx_static_cache_max_size: 256m
nginx_uploads_cache_path: "{{ nginx_cache_root_dir }}/project-uploads"
nginx_uploads_cache_max_size: 1g
